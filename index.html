<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Kamera Bukti Pendukung</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #08263a;

      color: white;

    }


    .camera-container {

      width: 100%;

      max-width: 900px;

      margin: 0 auto;

    }


    .title {

      text-align: center;

      font-size: 28px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .subtitle {

      text-align: center;

      font-size: 16px;

      margin-bottom: 20px;

    }


    select {

      width: 100%;

      height: 52px;

      border: 0;

      border-radius: 10px;

      padding: 0 15px;

      font-size: 17px;

      margin-bottom: 12px;

    }


    .video-box {

      width: 100%;

      background: black;

      border-radius: 12px;

      overflow: hidden;

      min-height: 300px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    video {

      display: block;

      width: 100%;

      max-height: 600px;

      object-fit: cover;

      background: black;

    }


    canvas {

      display: none;

      width: 100%;

      max-height: 600px;

      object-fit: contain;

      background: black;

    }


    .buttons {

      display: grid;

      grid-template-columns:
        1fr 1fr 1fr;

      gap: 8px;

      margin-top: 12px;

    }


    button {

      height: 52px;

      border: 0;

      border-radius: 9px;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    #btnBuka {

      background: #15945e;

    }


    #btnAmbil {

      background: #ed5b8c;

    }


    #btnUlang {

      background: #f1ae00;

    }


    button:disabled {

      opacity: .45;

      cursor: not-allowed;

    }


    .status {

      margin-top: 12px;

      padding: 15px;

      border-radius: 10px;

      background: #edf5fc;

      color: #153b58;

      font-size: 16px;

    }


    .location {

      margin-top: 12px;

      padding: 15px;

      border-radius: 10px;

      background: #edfaeb;

      color: #075b23;

      font-size: 16px;

      line-height: 1.6;

    }


    .preview {

      display: none;

      margin-top: 12px;

      padding: 10px;

      background: white;

      border-radius: 10px;

    }


    .preview img {

      display: block;

      width: 100%;

      max-height: 350px;

      object-fit: contain;

      border-radius: 8px;

      background: black;

    }


    @media(max-width:600px) {

      body {
        padding: 10px;
      }

      .title {
        font-size: 22px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<div class="camera-container">


  <div class="title">
    📷 KAMERA BUKTI PENDUKUNG
  </div>


  <div class="subtitle">
    TPA WONOKERTO
  </div>


  <!-- PILIH KAMERA -->

  <select id="cameraSelect">

    <option value="">
      Pilih kamera
    </option>

  </select>


  <!-- VIDEO -->

  <div class="video-box">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>


    <canvas id="canvas"></canvas>

  </div>


  <!-- TOMBOL -->

  <div class="buttons">

    <button
      id="btnBuka"
      type="button"
      onclick="bukaKamera()"
    >
      BUKA KAMERA
    </button>


    <button
      id="btnAmbil"
      type="button"
      onclick="ambilFoto()"
      disabled
    >
      AMBIL FOTO
    </button>


    <button
      id="btnUlang"
      type="button"
      onclick="ambilUlang()"
      disabled
    >
      AMBIL ULANG
    </button>

  </div>


  <!-- STATUS -->

  <div
    id="status"
    class="status"
  >
    Kamera belum aktif.
  </div>


  <!-- PREVIEW -->

  <div
    id="previewBox"
    class="preview"
  >

    <img
      id="preview"
      alt="Preview foto"
    >

  </div>


  <!-- LOKASI -->

  <div
    id="location"
    class="location"
  >

    📍 <strong>KOORDINAT</strong>

    <div>
      Latitude:
      <span id="latitude">-</span>
    </div>

    <div>
      Longitude:
      <span id="longitude">-</span>
    </div>

    <div>
      Akurasi:
      <span id="accuracy">-</span>
    </div>

  </div>


</div>


<script>


/* =====================================================
   VARIABEL
   ===================================================== */


let stream = null;

let fotoData = null;

let latitude = null;

let longitude = null;

let accuracy = null;

let cameraList = [];


/* =====================================================
   ELEMENT
   ===================================================== */


const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );


const preview =
  document.getElementById(
    "preview"
  );


const previewBox =
  document.getElementById(
    "previewBox"
  );


const status =
  document.getElementById(
    "status"
  );


const btnBuka =
  document.getElementById(
    "btnBuka"
  );


const btnAmbil =
  document.getElementById(
    "btnAmbil"
  );


const btnUlang =
  document.getElementById(
    "btnUlang"
  );


/* =====================================================
   STATUS
   ===================================================== */


function setStatus(
  pesan
) {

  status.textContent =
    pesan;

}


/* =====================================================
   LOAD CAMERA
   ===================================================== */


async function daftarKamera() {

  try {

    /*
     * Minta izin kamera terlebih dahulu.
     * Setelah izin diberikan browser
     * akan memberikan deviceId.
     */

    const izin =
      await navigator.mediaDevices.getUserMedia(
        {
          video: true,
          audio: false
        }
      );


    /*
     * Matikan stream sementara.
     * Kita hanya membutuhkan izin
     * agar daftar kamera dapat dibaca.
     */

    izin.getTracks().forEach(
      function(track) {

        track.stop();

      }
    );


    const devices =
      await navigator.mediaDevices.enumerateDevices();


    cameraList =
      devices.filter(
        function(device) {

          return (
            device.kind ===
            "videoinput"
          );

        }
      );


    cameraSelect.innerHTML =
      "";


    if (
      cameraList.length === 0
    ) {

      cameraSelect.innerHTML =
        "<option>" +
        "Kamera tidak ditemukan" +
        "</option>";

      setStatus(
        "❌ Kamera tidak ditemukan."
      );

      return;

    }


    cameraList.forEach(
      function(camera, index) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          camera.deviceId;


        option.textContent =
          camera.label ||
          ("Kamera " + (index + 1));


        cameraSelect.appendChild(
          option
        );

      }
    );


    setStatus(
      "✅ Kamera tersedia. Silakan buka kamera."
    );


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Kamera tidak dapat diakses: " +
      error.name
    );

  }

}


/* =====================================================
   BUKA KAMERA
   ===================================================== */


async function bukaKamera() {

  try {

    /*
     * Tutup kamera lama
     */

    hentikanKamera();


    const deviceId =
      cameraSelect.value;


    let constraints;


    if (deviceId) {

      constraints = {

        video: {

          deviceId: {
            exact: deviceId
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      };

    } else {

      constraints = {

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      };

    }


    stream =
      await navigator.mediaDevices.getUserMedia(
        constraints
      );


    video.srcObject =
      stream;


    video.style.display =
      "block";


    canvas.style.display =
      "none";


    await video.play();


    btnAmbil.disabled =
      false;


    btnUlang.disabled =
      true;


    setStatus(
      "✅ Kamera aktif. Arahkan kamera kemudian tekan AMBIL FOTO."
    );


    /*
     * Ambil lokasi
     */

    ambilLokasi();


  } catch (error) {

    console.error(error);


    btnAmbil.disabled =
      true;


    setStatus(
      "❌ Kamera tidak dapat dibuka: " +
      error.name +
      " - " +
      error.message
    );

  }

}


/* =====================================================
   AMBIL FOTO
   ===================================================== */


function ambilFoto() {

  if (!stream) {

    setStatus(
      "❌ Kamera belum aktif."
    );

    return;

  }


  if (
    video.videoWidth === 0 ||
    video.videoHeight === 0
  ) {

    setStatus(
      "❌ Kamera belum siap. Tunggu sebentar."
    );

    return;

  }


  /*
   * Ukuran foto mengikuti kamera
   */

  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  canvas.width =
    width;


  canvas.height =
    height;


  const context =
    canvas.getContext(
      "2d"
    );


  /*
   * Gambar frame kamera
   * ke canvas
   */

  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  /*
   * Konversi menjadi JPEG
   */

  fotoData =
    canvas.toDataURL(
      "image/jpeg",
      0.75
    );


  /*
   * Tampilkan preview
   */

  preview.src =
    fotoData;


  previewBox.style.display =
    "block";


  video.style.display =
    "none";


  canvas.style.display =
    "none";


  btnAmbil.disabled =
    true;


  btnUlang.disabled =
    false;


  setStatus(
    "✅ Foto berhasil diambil dan dikirim ke form."
  );


  /*
   * KIRIM FOTO KE INPUT V2
   */

  kirimFotoKeForm();

}


/* =====================================================
   KIRIM FOTO KE INPUT V2
   ===================================================== */


function kirimFotoKeForm() {

  if (!fotoData) {

    setStatus(
      "❌ Foto belum tersedia."
    );

    return;

  }


  const pesan = {

    type:
      "KAMERA_FOTO_TPA",

    foto:
      fotoData,

    nama:
      "FOTO-" +
      Date.now() +
      ".jpg",

    tipe:
      "image/jpeg",

    latitude:
      latitude,

    longitude:
      longitude,

    accuracy:
      accuracy

  };


  /*
   * Karena halaman ini sekarang
   * berada di dalam iframe InputV2,
   * gunakan parent.
   */

  try {

    window.parent.postMessage(
      pesan,
      "*"
    );

  } catch (error) {

    console.error(
      "Gagal mengirim foto:",
      error
    );

  }


  /*
   * Jika halaman kamera dibuka
   * sebagai halaman biasa, bukan iframe,
   * coba opener juga.
   */

  try {

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(
        pesan,
        "*"
      );

    }

  } catch (error) {

    console.error(error);

  }

}


/* =====================================================
   AMBIL ULANG
   ===================================================== */


function ambilUlang() {

  fotoData =
    null;


  preview.src =
    "";


  previewBox.style.display =
    "none";


  video.style.display =
    "block";


  canvas.style.display =
    "none";


  btnAmbil.disabled =
    false;


  btnUlang.disabled =
    true;


  setStatus(
    "Kamera aktif. Silakan ambil foto kembali."
  );

}


/* =====================================================
   LOKASI
   ===================================================== */


function ambilLokasi() {

  if (
    !navigator.geolocation
  ) {

    setLocationStatus(
      "-",
      "-",
      "-"
    );

    return;

  }


  setStatus(
    "✅ Kamera aktif. Mengambil koordinat lokasi..."
  );


  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude =
        position.coords.latitude;


      longitude =
        position.coords.longitude;


      accuracy =
        Math.round(
          position.coords.accuracy
        );


      document.getElementById(
        "latitude"
      ).textContent =
        latitude;


      document.getElementById(
        "longitude"
      ).textContent =
        longitude;


      document.getElementById(
        "accuracy"
      ).textContent =
        "±" +
        accuracy +
        " meter";


      setStatus(
        "✅ Kamera aktif dan koordinat berhasil diperoleh."
      );

    },


    function(error) {

      console.warn(
        "Lokasi gagal:",
        error
      );


      latitude =
        null;


      longitude =
        null;


      accuracy =
        null;


      setLocationStatus(
        "-",
        "-",
        "-"
      );


      setStatus(
        "⚠️ Kamera aktif, tetapi koordinat belum diperoleh."
      );

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

}


/* =====================================================
   STATUS LOKASI
   ===================================================== */


function setLocationStatus(
  lat,
  lng,
  acc
) {

  document.getElementById(
    "latitude"
  ).textContent =
    lat;


  document.getElementById(
    "longitude"
  ).textContent =
    lng;


  document.getElementById(
    "accuracy"
  ).textContent =
    acc;

}


/* =====================================================
   HENTIKAN KAMERA
   ===================================================== */


function hentikanKamera() {

  if (!stream) {
    return;
  }


  stream
    .getTracks()
    .forEach(
      function(track) {

        track.stop();

      }
    );


  stream =
    null;


  video.srcObject =
    null;


  btnAmbil.disabled =
    true;

}


/* =====================================================
   GANTI KAMERA
   ===================================================== */


cameraSelect.addEventListener(
  "change",
  function() {

    if (stream) {

      bukaKamera();

    }

  }
);


/* =====================================================
   SAAT HALAMAN DIBUKA
   ===================================================== */


document.addEventListener(
  "DOMContentLoaded",
  function() {

    /*
     * Pastikan API tersedia
     */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      setStatus(
        "❌ Browser tidak mendukung kamera."
      );

      return;

    }


    daftarKamera();

  }
);


/* =====================================================
   SAAT HALAMAN DITUTUP
   ===================================================== */


window.addEventListener(
  "beforeunload",
  function() {

    hentikanKamera();

  }
);

</script>

</body>

</html>
