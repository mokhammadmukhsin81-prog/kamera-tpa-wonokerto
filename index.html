<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kamera TPA Wonokerto</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef3f7;
    color: #173b5c;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    background: white;
    min-height: 100vh;
    box-shadow: 0 0 20px rgba(0,0,0,0.08);
}

.header {
    background: #062238;
    color: white;
    text-align: center;
    padding: 20px 15px;
}

.header h1 {
    margin: 0;
    font-size: 26px;
}

.header p {
    margin: 8px 0 0;
    font-size: 14px;
}

.content {
    padding: 18px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

select {
    width: 100%;
    padding: 12px;
    border: 1px solid #bbb;
    border-radius: 7px;
    font-size: 15px;
    background: white;
    margin-bottom: 15px;
}

.camera-box {
    width: 100%;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
}

video {
    display: block;
    width: 100%;
    max-height: 550px;
    object-fit: contain;
    background: #000;
}

canvas {
    display: none;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 13px 8px;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.btn-open {
    background: #2d8bdc;
}

.btn-photo {
    background: #df3262;
}

.btn-close {
    background: #555;
}

.btn-download {
    background: #198754;
}

.btn-retake {
    background: #f0ad00;
}

.status {
    text-align: center;
    font-weight: bold;
    margin: 12px 0;
    min-height: 20px;
}

.result-title {
    text-align: center;
    margin: 18px 0 10px;
    font-size: 18px;
}

.photo-result {
    width: 100%;
    border-radius: 8px;
    display: block;
    background: #eee;
}

.result-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}

.info {
    margin-top: 18px;
    padding: 12px;
    border-radius: 7px;
    background: #eef6fc;
    font-size: 13px;
    line-height: 1.5;
}

.footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: #777;
}

@media (max-width: 600px) {

    .content {
        padding: 12px;
    }

    .header h1 {
        font-size: 21px;
    }

    .buttons {
        grid-template-columns: 1fr;
    }

    .result-buttons {
        grid-template-columns: 1fr;
    }

    button {
        padding: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>KAMERA BUKTI PENDUKUNG</h1>
        <p>TPA WONOKERTO</p>
    </div>

    <div class="content">

        <label for="cameraSelect">PILIH KAMERA</label>

        <select id="cameraSelect">
            <option value="">Mencari kamera...</option>
        </select>

        <div class="camera-box">
            <video id="video" autoplay playsinline></video>
        </div>

        <canvas id="canvas"></canvas>

        <div class="buttons">

            <button
                id="openButton"
                class="btn-open">
                BUKA KAMERA
            </button>

            <button
                id="photoButton"
                class="btn-photo"
                disabled>
                AMBIL FOTO
            </button>

            <button
                id="closeButton"
                class="btn-close"
                disabled>
                TUTUP KAMERA
            </button>

        </div>

        <div id="status" class="status">
            Kamera belum aktif.
        </div>

        <h2 class="result-title">
            FOTO HASIL PENGAMBILAN
        </h2>

        <img
            id="photoResult"
            class="photo-result"
            alt="Hasil foto"
            style="display:none;">

        <div class="result-buttons">

            <button
                id="retakeButton"
                class="btn-retake"
                disabled>
                AMBIL ULANG
            </button>

            <button
                id="downloadButton"
                class="btn-download"
                disabled>
                DOWNLOAD FOTO
            </button>

        </div>

        <div class="info">
            <strong>Petunjuk:</strong><br>
            1. Pilih kamera yang ingin digunakan.<br>
            2. Tekan <strong>BUKA KAMERA</strong>.<br>
            3. Pastikan objek terlihat dengan jelas.<br>
            4. Tekan <strong>AMBIL FOTO</strong>.<br>
            5. Foto dapat diambil ulang atau di-download.
        </div>

    </div>

    <div class="footer">
        Kamera TPA Wonokerto
    </div>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

const cameraSelect = document.getElementById("cameraSelect");

const openButton = document.getElementById("openButton");
const photoButton = document.getElementById("photoButton");
const closeButton = document.getElementById("closeButton");

const retakeButton = document.getElementById("retakeButton");
const downloadButton = document.getElementById("downloadButton");

const photoResult = document.getElementById("photoResult");
const statusText = document.getElementById("status");

let stream = null;
let photoData = null;


/* =====================================
   MENCARI DAFTAR KAMERA
===================================== */

async function getCameras() {

    try {

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.enumerateDevices) {

            throw new Error(
                "Browser tidak mendukung pemilihan kamera."
            );
        }

        const devices =
            await navigator.mediaDevices.enumerateDevices();

        const cameras =
            devices.filter(
                device => device.kind === "videoinput"
            );

        cameraSelect.innerHTML = "";

        if (cameras.length === 0) {

            const option =
                document.createElement("option");

            option.textContent =
                "Kamera tidak ditemukan";

            option.value = "";

            cameraSelect.appendChild(option);

            return;
        }

        cameras.forEach((camera, index) => {

            const option =
                document.createElement("option");

            option.value = camera.deviceId;

            option.textContent =
                camera.label ||
                `Kamera ${index + 1}`;

            cameraSelect.appendChild(option);

        });

        statusText.textContent =
            cameras.length +
            " kamera tersedia.";

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Tidak dapat membaca daftar kamera.";
    }
}


/* =====================================
   BUKA KAMERA
===================================== */

async function openCamera() {

    try {

        stopCamera();

        const deviceId =
            cameraSelect.value;

        const constraints = {

            video: deviceId
                ? {
                    deviceId: {
                        exact: deviceId
                    }
                }
                : true,

            audio: false
        };

        stream =
            await navigator.mediaDevices
                .getUserMedia(constraints);

        video.srcObject = stream;

        photoButton.disabled = false;
        closeButton.disabled = false;

        openButton.disabled = true;

        statusText.textContent =
            "Kamera aktif.";

        /*
         * Setelah izin kamera diberikan,
         * label kamera biasanya menjadi tersedia.
         */
        await getCameras();

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.";

    }

}


/* =====================================
   TUTUP KAMERA
===================================== */

function stopCamera() {

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

        stream = null;
    }

    video.srcObject = null;

    photoButton.disabled = true;
    closeButton.disabled = true;

    openButton.disabled = false;

    statusText.textContent =
        "Kamera ditutup.";
}


/* =====================================
   AMBIL FOTO
===================================== */

function takePhoto() {

    if (!stream) {

        statusText.textContent =
            "Buka kamera terlebih dahulu.";

        return;
    }

    const width =
        video.videoWidth;

    const height =
        video.videoHeight;

    if (!width || !height) {

        statusText.textContent =
            "Video belum siap. Tunggu sebentar.";

        return;
    }

    canvas.width = width;
    canvas.height = height;

    const context =
        canvas.getContext("2d");

    context.drawImage(
        video,
        0,
        0,
        width,
        height
    );

    photoData =
        canvas.toDataURL(
            "image/jpeg",
            0.95
        );

    photoResult.src =
        photoData;

    photoResult.style.display =
        "block";

    retakeButton.disabled = false;
    downloadButton.disabled = false;

    statusText.textContent =
        "Foto berhasil diambil.";

}


/* =====================================
   DOWNLOAD FOTO
===================================== */

function downloadPhoto() {

    if (!photoData) {

        statusText.textContent =
            "Belum ada foto.";

        return;
    }

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    const hour =
        String(
            now.getHours()
        ).padStart(2, "0");

    const minute =
        String(
            now.getMinutes()
        ).padStart(2, "0");

    const second =
        String(
            now.getSeconds()
        ).padStart(2, "0");

    const filename =
        `bukti-tpa-wonokerto-${year}${month}${day}-${hour}${minute}${second}.jpg`;

    const link =
        document.createElement("a");

    link.href =
        photoData;

    link.download =
        filename;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    statusText.textContent =
        "Foto berhasil di-download.";
}


/* =====================================
   AMBIL ULANG
===================================== */

function retakePhoto() {

    photoResult.style.display =
        "none";

    photoResult.src = "";

    photoData = null;

    retakeButton.disabled = true;
    downloadButton.disabled = true;

    statusText.textContent =
        "Silakan ambil foto kembali.";
}


/* =====================================
   EVENT BUTTON
===================================== */

openButton.addEventListener(
    "click",
    openCamera
);

closeButton.addEventListener(
    "click",
    stopCamera
);

photoButton.addEventListener(
    "click",
    takePhoto
);

downloadButton.addEventListener(
    "click",
    downloadPhoto
);

retakeButton.addEventListener(
    "click",
    retakePhoto
);


/* =====================================
   GANTI KAMERA
===================================== */

cameraSelect.addEventListener(
    "change",
    async function() {

        if (stream) {

            await openCamera();

        }

    }
);


/* =====================================
   SAAT HALAMAN DIBUKA
===================================== */

window.addEventListener(
    "load",
    async function() {

        /*
         * Meminta izin kamera terlebih dahulu
         * agar nama kamera dapat dibaca.
         */

        try {

            const temporaryStream =
                await navigator.mediaDevices
                    .getUserMedia({
                        video: true,
                        audio: false
                    });

            temporaryStream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        } catch (error) {

            console.log(
                "Izin kamera belum diberikan."
            );

        }

        await getCameras();

    }
);


/* =====================================
   SAAT HALAMAN DITUTUP
===================================== */

window.addEventListener(
    "beforeunload",
    stopCamera
);

</script>

</body>
</html>
