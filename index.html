<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kamera TPA Wonokerto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #061f31;
      color: white;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 32px;
    }

    .panel {
      background: #0b3048;
      border-radius: 16px;
      padding: 20px;
    }

    .status {
      background: #e8f2fa;
      color: #123;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 17px;
    }

    select,
    button {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: none;
      font-size: 18px;
      margin-top: 10px;
    }

    select {
      background: white;
      color: #111;
    }

    button {
      background: #168f5a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #117547;
    }

    button:disabled {
      background: #666;
      cursor: not-allowed;
    }

    .kamera-box {
      margin-top: 20px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
    }

    video {
      display: block;
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      background: black;
    }

    .location {
      margin-top: 15px;
      background: #eaf7e7;
      color: #135b30;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .actions {
      margin-top: 15px;
    }

    canvas {
      display: none;
    }

    .info {
      margin-top: 15px;
      background: #102f42;
      padding: 12px;
      border-radius: 10px;
      color: #cde3f2;
      font-size: 14px;
      text-align: center;
    }

    .live-badge {
      display: inline-block;
      background: #d71920;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      margin-left: 8px;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>

    📷 KAMERA TPA WONOKERTO

    <span
      id="liveBadge"
      class="live-badge"
      style="display:none;"
    >
      LIVE
    </span>

  </h1>


  <div class="panel">


    <div
      id="status"
      class="status"
    >
      Menyiapkan kamera...
    </div>


    <select id="cameraSelect">

      <option value="">
        Memuat kamera...
      </option>

    </select>


    <button id="openCamera">

      📹 BUKA KAMERA

    </button>


    <div class="kamera-box">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

    </div>


    <div
      id="location"
      class="location"
    >
      📍 Koordinat:
      -7.641230, 112.764780
    </div>


    <div class="actions">

      <button
        id="capture"
        disabled
      >
        📸 AMBIL FOTO
      </button>

    </div>


    <div class="info">

      Kamera digunakan untuk pemantauan
      TPA Wonokerto.

      <br>

      Koordinat tetap:
      -7.641230, 112.764780

    </div>


  </div>


</div>


<canvas id="canvas"></canvas>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function() {


    /* =====================================================
       VARIABEL
    ===================================================== */

    let stream = null;

    let latitude = "-7.641230";

    let longitude = "112.764780";

    let liveTimer = null;


    const params =
      new URLSearchParams(
        window.location.search
      );


    const isLiveMode =
      params.get("mode") === "live";


    const cameraSelect =
      document.getElementById(
        "cameraSelect"
      );


    const openCamera =
      document.getElementById(
        "openCamera"
      );


    const capture =
      document.getElementById(
        "capture"
      );


    const video =
      document.getElementById(
        "video"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const status =
      document.getElementById(
        "status"
      );


    const locationText =
      document.getElementById(
        "location"
      );


    const liveBadge =
      document.getElementById(
        "liveBadge"
      );


    /* =====================================================
       KOORDINAT TETAP
    ===================================================== */

    function setLokasi() {

      latitude = "-7.641230";

      longitude = "112.764780";

      locationText.innerText =
        "📍 Koordinat Lokasi TPA: " +
        latitude +
        ", " +
        longitude;

    }


    /* =====================================================
       DAFTAR KAMERA
    ===================================================== */

    async function daftarKamera() {

      try {


        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "Browser tidak mendukung akses kamera."
          );

        }


        /*
         * Minta izin kamera terlebih dahulu.
         * Ini juga membuat label kamera
         * muncul pada enumerateDevices().
         */

        const temporaryStream =
          await navigator.mediaDevices.getUserMedia({

            video: true,

            audio: false

          });


        temporaryStream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );


        const devices =
          await navigator.mediaDevices
            .enumerateDevices();


        cameraSelect.innerHTML =
          "";


        const defaultOption =
          document.createElement(
            "option"
          );


        defaultOption.value = "";

        defaultOption.textContent =
          "Pilih kamera";


        cameraSelect.appendChild(
          defaultOption
        );


        let nomor = 1;


        devices.forEach(
          function(device) {


            if (
              device.kind !==
              "videoinput"
            ) {

              return;

            }


            const option =
              document.createElement(
                "option"
              );


            option.value =
              device.deviceId;


            option.textContent =
              device.label ||
              "Kamera " + nomor;


            cameraSelect.appendChild(
              option
            );


            nomor++;


          }
        );


        if (nomor === 1) {

          status.innerText =
            "❌ Tidak ditemukan kamera.";

        }
        else {

          status.innerText =
            "Silakan pilih kamera.";

        }


      }

      catch(error) {

        console.error(
          "Kesalahan daftar kamera:",
          error
        );


        status.innerText =
          "❌ Kamera tidak dapat diakses: " +
          error.message;


      }

    }


    /* =====================================================
       BUKA KAMERA
    ===================================================== */

    openCamera.onclick =
      async function() {


        try {


          if (stream) {

            stream
              .getTracks()
              .forEach(
                function(track) {

                  track.stop();

                }
              );

          }


          const deviceId =
            cameraSelect.value;


          let constraints;


          if (deviceId) {

            constraints = {

              video: {

                deviceId: {

                  exact: deviceId

                }

              },

              audio: false

            };

          }

          else {

            constraints = {

              video: {

                facingMode:
                  "environment"

              },

              audio: false

            };

          }


          status.innerText =
            "Membuka kamera...";


          stream =
            await navigator.mediaDevices
              .getUserMedia(
                constraints
              );


          video.srcObject =
            stream;


          await video.play();


          capture.disabled =
            false;


          status.innerText =
            "✅ Kamera aktif.";


          setLokasi();


          /*
           * Jika halaman dibuka dari Dashboard
           * dengan mode=live, kirim frame.
           */

          if (
            isLiveMode &&
            window.opener &&
            !window.opener.closed
          ) {

            liveBadge.style.display =
              "inline-block";


            mulaiLive();

          }


        }

        catch(error) {


          console.error(
            "Gagal membuka kamera:",
            error
          );


          status.innerText =
            "❌ Kamera gagal dibuka: " +
            error.name +
            " - " +
            error.message;


        }

      };


    /* =====================================================
       LIVE FRAME
    ===================================================== */

    function mulaiLive() {


      if (liveTimer) {

        clearInterval(
          liveTimer
        );

      }


      liveTimer =
        setInterval(
          function() {


            if (!stream) {

              return;

            }


            if (
              !video.videoWidth ||
              !video.videoHeight
            ) {

              return;

            }


            const width = 640;


            const height =
              Math.round(
                video.videoHeight *
                width /
                video.videoWidth
              );


            canvas.width =
              width;


            canvas.height =
              height;


            const ctx =
              canvas.getContext(
                "2d"
              );


            ctx.drawImage(

              video,

              0,

              0,

              width,

              height

            );


            const frame =
              canvas.toDataURL(
                "image/jpeg",
                0.60
              );


            try {


              if (
                window.opener &&
                !window.opener.closed
              ) {


                window.opener.postMessage(

                  {

                    type:
                      "KAMERA_LIVE_FRAME",

                    frame:
                      frame,

                    latitude:
                      latitude,

                    longitude:
                      longitude

                  },

                  "*"

                );


              }


            }

            catch(error) {

              console.error(
                "Gagal mengirim frame:",
                error
              );

            }


          },

          500

        );

    }


    /* =====================================================
       AMBIL FOTO
    ===================================================== */

    capture.onclick =
      function() {


        if (!stream) {

          alert(
            "Kamera belum dibuka."
          );

          return;

        }


        const width =
          video.videoWidth;


        const height =
          video.videoHeight;


        if (
          !width ||
          !height
        ) {

          alert(
            "Kamera belum siap."
          );

          return;

        }


        canvas.width =
          width;


        canvas.height =
          height;


        const context =
          canvas.getContext(
            "2d"
          );


        context.drawImage(

          video,

          0,

          0,

          width,

          height

        );


        /*
         * STAMP KOORDINAT
         */

        context.fillStyle =
          "rgba(0,0,0,0.65)";


        context.fillRect(

          15,

          height - 75,

          430,

          55

        );


        context.fillStyle =
          "#ffffff";


        context.font =
          "bold 20px Arial";


        context.fillText(

          "TPA WONOKERTO",

          30,

          height - 45

        );


        context.font =
          "16px Arial";


        context.fillText(

          latitude +
          ", " +
          longitude,

          30,

          height - 20

        );


        const foto =
          canvas.toDataURL(

            "image/jpeg",

            0.82

          );


        /*
         * Kirim foto ke Input V2
         */

        if (
          window.opener &&
          !window.opener.closed
        ) {


          window.opener.postMessage(

            {

              type:
                "KAMERA_TPA_RESULT",


              foto: {

                data:
                  foto,

                type:
                  "image/jpeg",

                nama:
                  "FOTO-" +
                  Date.now() +
                  ".jpg"

              },


              koordinat: {

                latitude:
                  latitude,

                longitude:
                  longitude

              }

            },

            "*"

          );


          status.innerText =
            "✅ Foto berhasil dikirim.";

        }

        else {

          status.innerText =
            "📸 Foto berhasil dibuat. " +
            "Halaman ini tidak memiliki " +
            "jendela Input V2.";

        }


      };


    /* =====================================================
       SAAT HALAMAN DIBUKA
    ===================================================== */

    setLokasi();


    if (isLiveMode) {

      liveBadge.style.display =
        "inline-block";

      status.innerText =
        "Mode LIVE. Pilih kamera.";

    }


    daftarKamera();


  }

);

</script>


</body>

</html>
