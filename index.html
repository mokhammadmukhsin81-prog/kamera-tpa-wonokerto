<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Kamera TPA Wonokerto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      padding: 12px;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 20px;
    }

    select,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 0;
      font-size: 15px;
    }

    select {
      background: white;
      color: #111;
    }

    button {
      background: #1976d2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #capture {
      background: #2e7d32;
    }

    video {
      display: block;
      width: 100%;
      max-height: 55vh;
      object-fit: contain;
      background: black;
      border-radius: 10px;
      margin-top: 10px;
    }

    canvas {
      display: none;
    }

    #status {
      margin-top: 10px;
      padding: 10px;
      background: #222;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    #location {
      margin-top: 8px;
      text-align: center;
      color: #ccc;
      font-size: 12px;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>📷 KAMERA BUKTI</h1>


  <!-- PILIH KAMERA -->

  <select id="cameraSelect">

    <option value="">
      Memilih kamera...
    </option>

  </select>


  <!-- BUKA KAMERA -->

  <button
    id="openCamera"
    type="button">

    🎥 BUKA KAMERA

  </button>


  <!-- VIDEO -->

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <!-- AMBIL FOTO -->

  <button
    id="capture"
    type="button"
    disabled>

    📷 AMBIL FOTO

  </button>


  <canvas id="canvas"></canvas>


  <div id="status">
    Kamera belum dibuka.
  </div>


  <div id="location">
    📍 Koordinat belum tersedia
  </div>

</div>


<script>

  let stream = null;

  let latitude = "";

  let longitude = "";

  let accuracy = "";


  const cameraSelect =
    document.getElementById(
      "cameraSelect"
    );


  const openCamera =
    document.getElementById(
      "openCamera"
    );


  const capture =
    document.getElementById(
      "capture"
    );


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  const status =
    document.getElementById(
      "status"
    );


  const locationText =
    document.getElementById(
      "location"
    );


  /*
   * =====================================================
   * DAFTAR KAMERA
   * =====================================================
   */

  async function daftarKamera() {

    try {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        status.innerText =
          "❌ Browser tidak mendukung kamera.";

        return;

      }


      /*
       * Minta izin kamera.
       */

      const temporaryStream =
        await navigator.mediaDevices
          .getUserMedia({

            video: true,

            audio: false

          });


      /*
       * Matikan stream sementara.
       */

      temporaryStream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );


      /*
       * Ambil daftar kamera.
       */

      const devices =
        await navigator.mediaDevices
          .enumerateDevices();


      cameraSelect.innerHTML =
        "";


      const cameras =
        devices.filter(
          function(device) {

            return (
              device.kind ===
              "videoinput"
            );

          }
        );


      if (
        cameras.length === 0
      ) {

        cameraSelect.innerHTML =
          "<option value=''>" +
          "Kamera tidak ditemukan" +
          "</option>";


        status.innerText =
          "❌ Kamera tidak ditemukan.";

        return;

      }


      cameras.forEach(
        function(camera, index) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            camera.deviceId;


          option.textContent =
            camera.label ||
            (
              "Kamera " +
              (index + 1)
            );


          cameraSelect.appendChild(
            option
          );

        }
      );


      /*
       * Pilih kamera pertama.
       */

      cameraSelect.value =
        cameras[0].deviceId;


      status.innerText =
        "Silakan tekan BUKA KAMERA.";

    }

    catch(error) {

      status.innerText =
        "❌ Akses kamera ditolak: " +
        error.message;

    }

  }


  /*
   * =====================================================
   * BUKA KAMERA
   * =====================================================
   */

  openCamera.onclick =
    async function() {

      try {

        /*
         * Matikan kamera lama
         * kalau ada.
         */

        stopCamera();


        const deviceId =
          cameraSelect.value;


        const constraints = {

          video:
            deviceId

              ? {
                  deviceId: {
                    exact:
                      deviceId
                  }
                }

              : {
                  facingMode:
                    "environment"
                },

          audio: false

        };


        stream =
          await navigator.mediaDevices
            .getUserMedia(
              constraints
            );


        video.srcObject =
          stream;


        await video.play();


        capture.disabled =
          false;


        status.innerText =
          "✅ Kamera aktif. Silakan AMBIL FOTO.";


        /*
         * Ambil GPS ketika kamera dibuka.
         */

        ambilLokasi();

      }

      catch(error) {

        status.innerText =
          "❌ Kamera gagal dibuka: " +
          error.message;

      }

    };


  /*
   * =====================================================
   * GPS
   * =====================================================
   */

  function ambilLokasi() {

    if (
      !navigator.geolocation
    ) {

      locationText.innerText =
        "📍 GPS tidak tersedia.";

      return;

    }


    navigator.geolocation
      .getCurrentPosition(

        function(position) {

          latitude =
            position.coords.latitude;

          longitude =
            position.coords.longitude;

          accuracy =
            position.coords.accuracy;


          locationText.innerText =
            "📍 " +
            latitude +
            ", " +
            longitude +
            " | ±" +
            Math.round(
              accuracy
            ) +
            " m";

        },

        function(error) {

          latitude = "";

          longitude = "";

          accuracy = "";


          locationText.innerText =
            "📍 Lokasi tidak diizinkan.";

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            10000,

          maximumAge:
            0

        }

      );

  }


  /*
   * =====================================================
   * AMBIL FOTO
   * =====================================================
   */

  capture.onclick =
    function() {

      if (!stream) {

        status.innerText =
          "❌ Kamera belum dibuka.";

        return;

      }


      const width =
        video.videoWidth;


      const height =
        video.videoHeight;


      if (
        !width ||
        !height
      ) {

        status.innerText =
          "❌ Kamera belum siap.";

        return;

      }


      /*
       * Canvas mengikuti resolusi kamera.
       */

      canvas.width =
        width;

      canvas.height =
        height;


      const context =
        canvas.getContext(
          "2d"
        );


      context.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      /*
       * Buat JPEG.
       */

      const foto =
        canvas.toDataURL(
          "image/jpeg",
          0.80
        );


      /*
       * Kirim ke parent InputV2.
       *
       * TIDAK menggunakan:
       * window.opener
       *
       * TIDAK membuka tab baru.
       *
       * TIDAK download.
       *
       * TIDAK window.close().
       */

      window.parent.postMessage(

        {

          type:
            "KAMERA_TPA_RESULT",

          foto: {

            data:
              foto,

            type:
              "image/jpeg",

            nama:
              "BUKTI-" +
              Date.now() +
              ".jpg"

          },

          koordinat: {

            latitude:
              latitude,

            longitude:
              longitude,

            accuracy:
              accuracy

          }

        },

        "*"

      );


      status.innerText =
        "✅ FOTO BERHASIL DIKIRIM KE INPUT V2";


      /*
       * JANGAN MATIKAN KAMERA.
       *
       * JANGAN TUTUP HALAMAN.
       *
       * User dapat tetap melihat kamera
       * dan InputV2 sudah menerima foto.
       */

    };


  /*
   * =====================================================
   * STOP CAMERA
   * =====================================================
   */

  function stopCamera() {

    if (!stream) {
      return;
    }


    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream = null;


    video.srcObject =
      null;


    capture.disabled =
      true;

  }


  /*
   * =====================================================
   * MULAI
   * =====================================================
   */

  window.addEventListener(
    "load",
    function() {

      daftarKamera();

    }
  );

</script>

</body>

</html>
