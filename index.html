<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Kamera TPA Wonokerto</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #08283d;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  width: min(95%, 680px);
  margin: 20px auto;
}

h1 {
  text-align: center;
  font-size: 24px;
  margin: 15px 0;
}

select {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: 0;
  font-size: 16px;
  margin-bottom: 10px;
}

.camera {
  width: 100%;
  background: black;
  border-radius: 12px;
  overflow: hidden;
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
}

video,
canvas {
  width: 100%;
  display: block;
}

canvas {
  display: none;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

button {
  border: 0;
  padding: 15px 10px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.open {
  background: #159447;
  color: white;
}

.take {
  background: #e93684;
  color: white;
}

.repeat {
  background: #f2ad00;
  color: white;
}

.status {
  background: #eef5fb;
  color: #0b3550;
  padding: 15px;
  border-radius: 8px;
  margin-top: 10px;
}

.location {
  background: #effbea;
  color: #145c1e;
  padding: 15px;
  border-radius: 8px;
  margin-top: 10px;
  line-height: 1.5;
}

.error {
  background: #ffe1e1;
  color: #8d1111;
}

.success {
  background: #daf5df;
  color: #11631e;
}

</style>

</head>


<body>

<div class="container">

<h1>
📷 KAMERA BUKTI PENDUKUNG
</h1>


<select id="cameraSelect">

<option>
Pilih kamera
</option>

</select>


<div class="camera">

<video
  id="video"
  autoplay
  playsinline>
</video>

<canvas
  id="canvas">
</canvas>

</div>


<div class="buttons">

<button
  class="open"
  onclick="bukaKamera()">

BUKA KAMERA

</button>


<button
  id="ambil"
  class="take"
  onclick="ambilFoto()"
  disabled>

AMBIL FOTO

</button>


<button
  id="ulang"
  class="repeat"
  onclick="ambilUlang()"
  disabled>

AMBIL ULANG

</button>

</div>


<div
  id="status"
  class="status">

Kamera belum dibuka.

</div>


<div
  id="lokasi"
  class="location">

📍 KOORDINAT

<div id="koordinat">
Menunggu lokasi...
</div>

</div>

</div>


<script>

let stream = null;

let fotoData = null;

let latitude = "";

let longitude = "";

let accuracy = "";


/* =================================================
   ELEMEN
   ================================================= */

const video =
  document.getElementById(
    "video"
  );

const canvas =
  document.getElementById(
    "canvas"
  );

const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );

const statusBox =
  document.getElementById(
    "status"
  );


/* =================================================
   AMBIL DAFTAR KAMERA
   ================================================= */

async function daftarKamera() {

  try {

    const devices =
      await navigator.mediaDevices.enumerateDevices();


    const cameras =
      devices.filter(
        function(device) {

          return (
            device.kind ===
            "videoinput"
          );

        }
      );


    cameraSelect.innerHTML = "";


    if (!cameras.length) {

      cameraSelect.innerHTML =
        "<option>Kamera tidak ditemukan</option>";

      return;

    }


    cameras.forEach(
      function(camera, index) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          camera.deviceId;


        option.textContent =
          camera.label ||
          ("Kamera " + (index + 1));


        cameraSelect.appendChild(
          option
        );

      }
    );

  }

  catch(error) {

    tampilError(
      "Tidak dapat membaca kamera: " +
      error.message
    );

  }

}


/* =================================================
   BUKA KAMERA
   ================================================= */

async function bukaKamera() {

  try {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    const deviceId =
      cameraSelect.value;


    const constraints = {

      video: deviceId &&
             deviceId !== "Pilih kamera"

        ? {
            deviceId: {
              exact: deviceId
            }
          }

        : {
            facingMode:
              "environment"
          }

    };


    stream =
      await navigator
        .mediaDevices
        .getUserMedia(
          constraints
        );


    video.srcObject =
      stream;


    video.style.display =
      "block";


    canvas.style.display =
      "none";


    document.getElementById(
      "ambil"
    ).disabled =
      false;


    document.getElementById(
      "ulang"
    ).disabled =
      true;


    tampilSukses(
      "✓ Kamera aktif."
    );


    await daftarKamera();

    ambilLokasi();

  }

  catch(error) {

    tampilError(
      "Kamera tidak dapat dibuka: " +
      error.name +
      " - " +
      error.message
    );

  }

}


/* =================================================
   AMBIL FOTO
   ================================================= */

function ambilFoto() {

  if (!stream) {

    tampilError(
      "Buka kamera terlebih dahulu."
    );

    return;

  }


  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  if (!width || !height) {

    tampilError(
      "Video kamera belum siap."
    );

    return;

  }


  canvas.width =
    width;

  canvas.height =
    height;


  const context =
    canvas.getContext(
      "2d"
    );


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  /*
   * Kompresi JPEG
   * supaya pengiriman ke Apps Script
   * tidak terlalu besar.
   */

  fotoData =
    canvas.toDataURL(
      "image/jpeg",
      0.82
    );


  video.style.display =
    "none";


  canvas.style.display =
    "block";


  document.getElementById(
    "ambil"
  ).disabled =
    true;


  document.getElementById(
    "ulang"
  ).disabled =
    false;


  tampilSukses(
    "✓ Foto berhasil diambil. Mengirim ke form..."
  );


  /*
   * KIRIM OTOMATIS KE INPUT V2
   */

  kirimKeForm();

}


/* =================================================
   AMBIL ULANG
   ================================================= */

function ambilUlang() {

  fotoData =
    null;


  canvas.style.display =
    "none";


  video.style.display =
    "block";


  document.getElementById(
    "ambil"
  ).disabled =
    false;


  document.getElementById(
    "ulang"
  ).disabled =
    true;


  tampilSukses(
    "Kamera siap. Ambil foto kembali."
  );

}


/* =================================================
   KIRIM KE FORM APPS SCRIPT
   ================================================= */

function kirimKeForm() {

  if (!window.opener) {

    tampilError(
      "Halaman kamera tidak menemukan halaman Input V2. Buka kamera dari tombol BUKA KAMERA pada form."
    );

    return;

  }


  window.opener.postMessage(

    {

      type:
        "TPA_WONOKERTO_FOTO",

      foto:
        fotoData,

      latitude:
        latitude,

      longitude:
        longitude,

      accuracy:
        accuracy

    },

    "*"

  );


  /*
   * Tunggu sebentar agar pesan diterima,
   * lalu tutup halaman kamera.
   */

  setTimeout(
    function() {

      tampilSukses(
        "✓ Foto sudah dikirim ke form. Halaman kamera akan ditutup."
      );


      setTimeout(
        function() {

          window.close();

        },
        700
      );

    },
    300
  );

}


/* =================================================
   LOKASI
   ================================================= */

function ambilLokasi() {

  if (!navigator.geolocation) {

    document.getElementById(
      "koordinat"
    ).innerHTML =
      "GPS tidak tersedia.";

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude =
        position.coords.latitude;

      longitude =
        position.coords.longitude;

      accuracy =
        Math.round(
          position.coords.accuracy
        );


      document.getElementById(
        "koordinat"
      ).innerHTML =

        "Latitude: " +
        latitude +
        "<br>" +

        "Longitude: " +
        longitude +
        "<br>" +

        "Akurasi: ±" +
        accuracy +
        " meter";

    },

    function(error) {

      document.getElementById(
        "koordinat"
      ).innerHTML =
        "Lokasi tidak tersedia: " +
        error.message;

    },

    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

}


/* =================================================
   STATUS
   ================================================= */

function tampilSukses(text) {

  statusBox.className =
    "status success";

  statusBox.innerText =
    text;

}


function tampilError(text) {

  statusBox.className =
    "status error";

  statusBox.innerText =
    "✕ " + text;

}


/* =================================================
   SAAT HALAMAN SIAP
   ================================================= */

window.addEventListener(
  "load",
  function() {

    daftarKamera();

  }
);


/* =================================================
   SAAT HALAMAN DITUTUP
   ================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

  }
);

</script>

</body>

</html>
