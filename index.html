<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kamera TPA Wonokerto V2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f7;
      color: #173b5c;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 34px;
    }

    .subtitle {
      text-align: center;
      color: #607d95;
      margin-bottom: 30px;
      font-size: 18px;
    }

    .camera-box {
      background: #071d2d;
      padding: 20px;
      border-radius: 16px;
      color: white;
    }

    .camera-box h2 {
      text-align: center;
      margin-top: 0;
    }

    video {
      width: 100%;
      max-height: 500px;
      background: black;
      border-radius: 12px;
      display: block;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #openCamera {
      background: #287fd3;
      color: white;
    }

    #capture {
      background: #dc3562;
      color: white;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    canvas {
      display: none;
    }

    #preview {
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
      display: none;
    }

    @media (max-width: 700px) {
      .container {
        margin: 10px;
        padding: 15px;
      }

      h1 {
        font-size: 25px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>KAMERA TPA WONOKERTO V2</h1>

    <div class="subtitle">
      Kamera bukti pendukung
    </div>

    <div class="camera-box">

      <h2>KAMERA BUKTI PENDUKUNG</h2>

      <video id="video" autoplay playsinline></video>

      <div class="buttons">
        <button id="openCamera">
          BUKA KAMERA
        </button>

        <button id="capture">
          AMBIL FOTO
        </button>
      </div>

      <div id="status">
        Kamera belum dibuka.
      </div>

      <canvas id="canvas"></canvas>

      <img id="preview" alt="Hasil foto">

    </div>

  </div>

  <script>

    let stream = null;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");

    document.getElementById("openCamera").addEventListener("click", async function () {

      try {

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }

        status.textContent = "Meminta izin kamera...";

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment"
          },
          audio: false
        });

        video.srcObject = stream;

        status.textContent = "Kamera aktif.";

      } catch (error) {

        console.error(error);

        status.textContent =
          "Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.";

      }

    });


    document.getElementById("capture").addEventListener("click", function () {

      if (!stream) {
        status.textContent = "Buka kamera terlebih dahulu.";
        return;
      }

      if (video.videoWidth === 0 || video.videoHeight === 0) {
        status.textContent = "Video belum siap.";
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const context = canvas.getContext("2d");

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const foto = canvas.toDataURL("image/jpeg", 0.90);

      preview.src = foto;
      preview.style.display = "block";

      status.textContent = "Foto berhasil diambil.";

    });

  </script>

</body>
</html>
