<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Kamera TPA Wonokerto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 25px;
    }

    select,
    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border-radius: 8px;
      border: 0;
      font-size: 17px;
    }

    select {
      background: white;
      color: #111;
    }

    button {
      background: #1976d2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #capture {
      background: #2e7d32;
    }

    video {
      display: block;
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      background: black;
      border-radius: 10px;
      margin-top: 15px;
    }

    canvas {
      display: none;
    }

    #status {
      margin-top: 15px;
      padding: 13px;
      background: #222;
      border-radius: 8px;
      text-align: center;
      line-height: 1.5;
    }

    #location {
      margin-top: 10px;
      padding: 12px;
      background: #222;
      border-radius: 8px;
      text-align: center;
      color: #ddd;
      font-size: 14px;
      line-height: 1.6;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📷 KAMERA TPA WONOKERTO
  </h1>


  <select id="cameraSelect">

    <option value="">
      Pilih kamera
    </option>

  </select>


  <button id="openCamera">
    🎥 BUKA KAMERA
  </button>


  <video
    id="video"
    autoplay
    playsinline>
  </video>


  <button
    id="capture"
    disabled>
    📷 AMBIL FOTO
  </button>


  <canvas id="canvas"></canvas>


  <div id="status">
    Kamera belum dibuka.
  </div>


  <div id="location">
    📍 Lokasi TPA belum ditampilkan.
  </div>


</div>


<script>


/* =========================================================
   KOORDINAT TETAP TPA WONOKERTO
   ========================================================= */

const FIXED_LATITUDE =
  -7.641230;


const FIXED_LONGITUDE =
  112.764780;


/*
 * Bukan hasil pengukuran GPS.
 * Karena lokasi ditetapkan secara tetap.
 */

const FIXED_ACCURACY =
  "";


/* =========================================================
   VARIABEL KAMERA
   ========================================================= */

let stream = null;


let latitude =
  FIXED_LATITUDE;


let longitude =
  FIXED_LONGITUDE;


let accuracy =
  FIXED_ACCURACY;


/* =========================================================
   ELEMENT
   ========================================================= */

const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );


const openCamera =
  document.getElementById(
    "openCamera"
  );


const capture =
  document.getElementById(
    "capture"
  );


const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const status =
  document.getElementById(
    "status"
  );


const locationText =
  document.getElementById(
    "location"
  );


/* =========================================================
   FORMAT KOORDINAT
   ========================================================= */

function formatKoordinat(
  value
) {

  return Number(value)
    .toFixed(6);

}


/* =========================================================
   FORMAT TANGGAL DAN JAM
   ========================================================= */

function formatTanggalWaktu(
  date
) {

  function pad(number) {

    return String(number)
      .padStart(2, "0");

  }


  return (

    pad(date.getDate()) +
    "/" +
    pad(date.getMonth() + 1) +
    "/" +
    date.getFullYear() +

    " " +

    pad(date.getHours()) +
    ":" +
    pad(date.getMinutes()) +
    ":" +
    pad(date.getSeconds())

  );

}


/* =========================================================
   TAMPILKAN LOKASI TETAP
   ========================================================= */

function tampilkanLokasi() {

  latitude =
    FIXED_LATITUDE;


  longitude =
    FIXED_LONGITUDE;


  accuracy =
    FIXED_ACCURACY;


  locationText.innerHTML =

    "📍 <b>LOKASI TPA WONOKERTO</b>" +

    "<br>" +

    "Latitude: " +
    formatKoordinat(
      latitude
    ) +

    "<br>" +

    "Longitude: " +
    formatKoordinat(
      longitude
    ) +

    "<br>" +

    "Lokasi: Tetap";


}


/* =========================================================
   DAFTAR KAMERA
   ========================================================= */

async function daftarKamera() {

  try {

    status.innerText =
      "⏳ Meminta izin kamera...";


    const temporaryStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: true,

          audio: false

        });


    temporaryStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    const devices =
      await navigator.mediaDevices
        .enumerateDevices();


    cameraSelect.innerHTML =
      '<option value="">Pilih kamera</option>';


    let nomor =
      1;


    devices.forEach(
      function(device) {


        if (
          device.kind !==
          "videoinput"
        ) {

          return;

        }


        const option =
          document.createElement(
            "option"
          );


        option.value =
          device.deviceId;


        option.textContent =
          device.label ||
          "Kamera " +
          nomor;


        cameraSelect.appendChild(
          option
        );


        nomor++;

      }
    );


    tampilkanLokasi();


    status.innerText =
      "Silakan pilih kamera.";


  }

  catch(error) {

    status.innerText =
      "❌ Kamera tidak dapat diakses: " +
      error.message;

  }

}


/* =========================================================
   BUKA KAMERA
   ========================================================= */

openCamera.onclick =
  async function() {


    const deviceId =
      cameraSelect.value;


    try {


      if (stream) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

      }


      const constraints = {

        video:

          deviceId

            ? {

                deviceId: {

                  exact:
                    deviceId

                }

              }

            : {

                facingMode:
                  "environment"

              },

        audio:
          false

      };


      stream =
        await navigator
          .mediaDevices
          .getUserMedia(
            constraints
          );


      video.srcObject =
        stream;


      capture.disabled =
        false;


      tampilkanLokasi();


      status.innerText =
        "✅ Kamera aktif. Lokasi TPA sudah ditetapkan. Silakan ambil foto.";


    }

    catch(error) {

      status.innerText =
        "❌ Kamera gagal dibuka: " +
        error.message;

    }

  };


/* =========================================================
   STAMP FOTO
   ========================================================= */

function stampFoto(
  sourceCanvas,
  tanggal
) {


  const ctx =
    sourceCanvas.getContext(
      "2d"
    );


  const width =
    sourceCanvas.width;


  const height =
    sourceCanvas.height;


  /*
   * Ukuran tulisan mengikuti
   * resolusi foto.
   */

  const ukuranDasar =
    Math.max(
      18,
      Math.round(
        width * 0.022
      )
    );


  const padding =
    Math.round(
      ukuranDasar * 0.8
    );


  const lineHeight =
    Math.round(
      ukuranDasar * 1.45
    );


  const baris = [

    "TPA WONOKERTO",

    formatTanggalWaktu(
      tanggal
    ),

    "LAT : " +
      formatKoordinat(
        FIXED_LATITUDE
      ),

    "LON : " +
      formatKoordinat(
        FIXED_LONGITUDE
      ),

    "LOKASI : TETAP"

  ];


  const tinggiStamp =
    (
      baris.length *
      lineHeight
    ) +
    padding * 2;


  /*
   * Background hitam transparan.
   */

  ctx.fillStyle =
    "rgba(0,0,0,0.72)";


  ctx.fillRect(

    0,

    height -
      tinggiStamp,

    width,

    tinggiStamp

  );


  /*
   * Teks putih.
   */

  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    "bold " +
    ukuranDasar +
    "px Arial";


  ctx.textBaseline =
    "top";


  baris.forEach(
    function(teks, index) {


      ctx.fillText(

        teks,

        padding,

        height -
          tinggiStamp +
          padding +
          (
            index *
            lineHeight
          )

      );


    }
  );

}


/* =========================================================
   AMBIL FOTO
   ========================================================= */

capture.onclick =
  function() {


    if (!stream) {

      status.innerText =
        "❌ Kamera belum dibuka.";

      return;

    }


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if (
      !width ||
      !height
    ) {

      status.innerText =
        "❌ Kamera belum siap.";

      return;

    }


    /*
     * Pastikan koordinat tetap.
     */

    latitude =
      FIXED_LATITUDE;


    longitude =
      FIXED_LONGITUDE;


    accuracy =
      FIXED_ACCURACY;


    /*
     * Ukuran canvas sama dengan
     * ukuran video.
     */

    canvas.width =
      width;


    canvas.height =
      height;


    const context =
      canvas.getContext(
        "2d"
      );


    /*
     * Ambil gambar dari kamera.
     */

    context.drawImage(

      video,

      0,

      0,

      width,

      height

    );


    /*
     * Waktu pengambilan foto.
     */

    const tanggal =
      new Date();


    /*
     * STAMP LANGSUNG KE FOTO.
     */

    stampFoto(
      canvas,
      tanggal
    );


    /*
     * Buat JPEG hasil akhir.
     */

    const foto =
      canvas.toDataURL(
        "image/jpeg",
        0.82
      );


    status.innerText =
      "⏳ Foto sudah diberi stamp. Mengirim ke Input V2...";


    /*
     * InputV2 dibuka sebagai
     * window induk.
     */

    const target =
      window.opener;


    if (
      !target ||
      target.closed
    ) {

      status.innerText =
        "❌ Input V2 tidak ditemukan. Buka kamera dari Input V2.";

      return;

    }


    /*
     * Kirim foto ke InputV2.
     */

    target.postMessage(

      {

        type:
          "KAMERA_TPA_RESULT",


        foto: {

          data:
            foto,

          type:
            "image/jpeg",

          nama:
            "FOTO-TPA-WONOKERTO-" +
            Date.now() +
            ".jpg"

        },


        koordinat: {

          latitude:
            FIXED_LATITUDE,

          longitude:
            FIXED_LONGITUDE,

          accuracy:
            FIXED_ACCURACY

        }

      },

      "*"

    );


    status.innerText =
      "✅ Foto sudah diberi stamp dan dikirim ke Input V2.";


    /*
     * Matikan kamera.
     */

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream =
      null;


    capture.disabled =
      true;


    /*
     * Tutup halaman kamera
     * setelah foto terkirim.
     */

    setTimeout(
      function() {

        try {

          window.close();

        }

        catch(error) {

          console.log(
            error
          );

        }

      },
      800
    );

  };


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
  "load",
  daftarKamera
);


</script>


</body>

</html>
