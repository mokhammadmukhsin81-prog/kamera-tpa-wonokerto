<script>

let stream = null;
let latitude = "";
let longitude = "";

const params = new URLSearchParams(window.location.search);

const cameraSelect = document.getElementById("cameraSelect");
const openCamera = document.getElementById("openCamera");
const capture = document.getElementById("capture");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");
const locationText = document.getElementById("location");

const isLiveMode =
  params.get("mode") === "live";


/* =====================================================
   DAFTAR KAMERA
===================================================== */

async function daftarKamera() {

  try {

    const temporaryStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    temporaryStream
      .getTracks()
      .forEach(track => track.stop());

    const devices =
      await navigator.mediaDevices.enumerateDevices();

    cameraSelect.innerHTML =
      '<option value="">Pilih kamera</option>';

    let nomor = 1;

    devices.forEach(function(device) {

      if (device.kind !== "videoinput") {
        return;
      }

      const option =
        document.createElement("option");

      option.value = device.deviceId;

      option.textContent =
        device.label ||
        "Kamera " + nomor;

      cameraSelect.appendChild(option);

      nomor++;

    });

    status.innerText =
      "Silakan pilih kamera.";

  }

  catch(error) {

    status.innerText =
      "❌ Kamera tidak dapat diakses: " +
      error.message;

  }

}


/* =====================================================
   BUKA KAMERA
===================================================== */

openCamera.onclick = async function() {

  const deviceId =
    cameraSelect.value;

  try {

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

    }

    const constraints = {

      video:
        deviceId
          ? {
              deviceId: {
                exact: deviceId
              }
            }
          : {
              facingMode: "environment"
            },

      audio: false

    };

    stream =
      await navigator.mediaDevices.getUserMedia(
        constraints
      );

    video.srcObject = stream;

    capture.disabled = false;

    status.innerText =
      "✅ Kamera aktif.";

    ambilLokasi();

    /*
     * Kalau dibuka dari Dashboard,
     * mulai kirim frame live.
     */
    if (window.opener && !window.opener.closed) {

      mulaiLive();

    }

  }

  catch(error) {

    status.innerText =
      "❌ Kamera gagal dibuka: " +
      error.message;

  }

};


/* =====================================================
   LOKASI TETAP
===================================================== */

function ambilLokasi() {

  /*
   * Koordinat lokasi TPA yang sudah ditentukan.
   */

  latitude = -7.641230;
  longitude = 112.764780;

  locationText.innerText =
    "📍 " +
    latitude +
    ", " +
    longitude;

}


/* =====================================================
   LIVE STREAM KE DASHBOARD
===================================================== */

let liveTimer = null;

function mulaiLive() {

  if (liveTimer) {
    clearInterval(liveTimer);
  }

  liveTimer = setInterval(function() {

    if (!stream) {
      return;
    }

    if (!video.videoWidth || !video.videoHeight) {
      return;
    }

    const width = 640;

    const height =
      Math.round(
        video.videoHeight *
        width /
        video.videoWidth
      );

    canvas.width = width;
    canvas.height = height;

    const ctx =
      canvas.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );

    const frame =
      canvas.toDataURL(
        "image/jpeg",
        0.60
      );

    try {

      window.opener.postMessage(

        {
          type: "KAMERA_LIVE_FRAME",
          frame: frame,
          latitude: latitude,
          longitude: longitude
        },

        "*"

      );

    }

    catch(error) {

      console.log(
        "Gagal mengirim frame:",
        error
      );

    }

  }, 250);

}


/* =====================================================
   AMBIL FOTO
===================================================== */

capture.onclick = function() {

  if (!stream) {

    alert("Kamera belum dibuka.");

    return;

  }

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;

  if (!width || !height) {

    alert("Kamera belum siap.");

    return;

  }

  canvas.width = width;
  canvas.height = height;

  const context =
    canvas.getContext("2d");

  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );

  const foto =
    canvas.toDataURL(
      "image/jpeg",
      0.82
    );

  /*
   * Kirim foto ke Input V2.
   */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type: "KAMERA_TPA_RESULT",

        foto: {
          data: foto,
          type: "image/jpeg",
          nama:
            "FOTO-" +
            Date.now() +
            ".jpg"
        },

        koordinat: {
          latitude: latitude,
          longitude: longitude
        }

      },

      "*"

    );

    status.innerText =
      "✅ Foto dikirim ke Input V2.";

  }

};


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  daftarKamera
);

</script>
