<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    Kamera TPA Wonokerto
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #06283d;
      color: white;
    }

    .container {
      width: min(900px, 96%);
      margin: 0 auto;
      padding: 20px 0 30px;
    }

    h1 {
      text-align: center;
      margin: 0 0 15px;
      font-size: 32px;
    }

    .status {
      background: #e8f4fb;
      color: #123;
      padding: 12px 15px;
      border-radius: 9px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    select,
    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    select {
      background: white;
      color: #222;
    }

    button {
      background: #14965c;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #777;
      cursor: not-allowed;
    }

    .video-box {
      width: 100%;
      background: #000;
      border-radius: 9px;
      overflow: hidden;
      margin-top: 4px;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 650px;
      object-fit: contain;
      background: #000;
    }

    .location {
      background: #eef9e9;
      color: #17652d;
      padding: 12px 15px;
      border-radius: 9px;
      margin-top: 10px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      opacity: .8;
    }

    /*
      MODE LIVE
      Dashboard akan memakai halaman ini sebagai sumber kamera.
      Tampilan dibuat sederhana.
    */

    body.live-mode .container {
      width: 100%;
      padding: 0;
    }

    body.live-mode h1 {
      display: none;
    }

    body.live-mode .status {
      margin: 0 0 8px;
      border-radius: 0;
    }

    body.live-mode select {
      margin: 0 0 8px;
      border-radius: 0;
    }

    body.live-mode button {
      margin: 0 0 8px;
      border-radius: 0;
    }

    body.live-mode .video-box {
      margin: 0;
      border-radius: 0;
    }

    body.live-mode .location {
      margin: 8px;
    }

    body.live-mode .footer {
      display: none;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📹 KAMERA TPA WONOKERTO
  </h1>


  <div
    id="status"
    class="status">

    🟡 Menyiapkan kamera...

  </div>


  <select id="cameraSelect">

    <option value="">
      Memilih kamera...
    </option>

  </select>


  <button id="openCamera">

    📹 BUKA KAMERA

  </button>


  <div class="video-box">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>

  </div>


  <div
    id="location"
    class="location">

    📍 Koordinat TPA:
    -7.641230, 112.764780

  </div>


  <button
    id="capture"
    disabled>

    📸 AMBIL FOTO

  </button>


  <div class="footer">

    Kamera ini digunakan sebagai sumber
    LIVE MONITORING dashboard TPA Wonokerto.

  </div>


  <canvas
    id="canvas"
    style="display:none;">
  </canvas>


</div>


<script>


/* =====================================================
   KONFIGURASI
===================================================== */

const LATITUDE = -7.641230;

const LONGITUDE = 112.764780;

const params =
  new URLSearchParams(
    window.location.search
  );

const isLiveMode =
  params.get("mode") === "live";


if (isLiveMode) {

  document.body.classList.add(
    "live-mode"
  );

}


/* =====================================================
   ELEMENT
===================================================== */

const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );

const openCamera =
  document.getElementById(
    "openCamera"
  );

const capture =
  document.getElementById(
    "capture"
  );

const video =
  document.getElementById(
    "video"
  );

const canvas =
  document.getElementById(
    "canvas"
  );

const status =
  document.getElementById(
    "status"
  );

const locationText =
  document.getElementById(
    "location"
  );


/* =====================================================
   STREAM
===================================================== */

let stream = null;


/* =====================================================
   KOORDINAT TETAP
===================================================== */

function setLokasi() {

  locationText.innerText =
    "📍 Koordinat TPA: " +
    LATITUDE +
    ", " +
    LONGITUDE;

}


/* =====================================================
   DAFTAR KAMERA
===================================================== */

async function daftarKamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung kamera."
      );

    }


    /*
     * Minta izin kamera terlebih dahulu.
     * Ini penting supaya nama kamera
     * bisa terbaca oleh enumerateDevices().
     */

    const tempStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });


    tempStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });


    const devices =
      await navigator.mediaDevices.enumerateDevices();


    cameraSelect.innerHTML =
      '<option value="">Pilih kamera</option>';


    let nomor = 1;


    devices.forEach(function(device) {

      if (
        device.kind !==
        "videoinput"
      ) {

        return;

      }


      const option =
        document.createElement(
          "option"
        );


      option.value =
        device.deviceId;


      option.textContent =
        device.label ||
        "Kamera " + nomor;


      cameraSelect.appendChild(
        option
      );


      nomor++;

    });


    if (
      cameraSelect.options.length <= 1
    ) {

      status.innerText =
        "❌ Kamera tidak ditemukan.";

      return;

    }


    status.innerText =
      "✅ Kamera tersedia. Silakan pilih kamera.";


    /*
     * MODE LIVE:
     * pilih kamera pertama secara otomatis
     * jika belum ada pilihan.
     */

    if (isLiveMode) {

      const firstCamera =
        cameraSelect.options[1];

      if (firstCamera) {

        cameraSelect.value =
          firstCamera.value;

        await bukaKamera();

      }

    }

  }

  catch(error) {

    console.error(error);

    status.innerText =
      "❌ Kamera tidak dapat diakses: " +
      error.message;

  }

}


/* =====================================================
   BUKA KAMERA
===================================================== */

async function bukaKamera() {

  const deviceId =
    cameraSelect.value;


  try {


    if (stream) {

      stream
        .getTracks()
        .forEach(function(track) {

          track.stop();

        });

    }


    let constraints;


    if (deviceId) {

      constraints = {

        video: {

          deviceId: {
            exact: deviceId
          }

        },

        audio: false

      };

    }

    else {

      constraints = {

        video: {

          facingMode: {
            ideal: "environment"
          }

        },

        audio: false

      };

    }


    stream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    video.srcObject =
      stream;


    await video.play();


    capture.disabled =
      false;


    setLokasi();


    status.innerText =
      "🟢 KAMERA AKTIF — LIVE";


  }

  catch(error) {

    console.error(error);

    status.innerText =
      "❌ Kamera gagal dibuka: " +
      error.message;

  }

}


/* =====================================================
   TOMBOL BUKA KAMERA
===================================================== */

openCamera.onclick =
  async function() {

    await bukaKamera();

  };


/* =====================================================
   AMBIL FOTO
===================================================== */

capture.onclick =
  function() {


    if (!stream) {

      alert(
        "Kamera belum dibuka."
      );

      return;

    }


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if (
      !width ||
      !height
    ) {

      alert(
        "Kamera belum siap."
      );

      return;

    }


    canvas.width =
      width;


    canvas.height =
      height;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    /*
     * Stamp koordinat pada foto.
     */

    ctx.fillStyle =
      "rgba(0,0,0,.65)";


    ctx.fillRect(
      15,
      height - 65,
      430,
      45
    );


    ctx.fillStyle =
      "#ffffff";


    ctx.font =
      "bold 20px Arial";


    ctx.fillText(
      "TPA WONOKERTO",
      30,
      height - 38
    );


    ctx.font =
      "16px Arial";


    ctx.fillText(
      LATITUDE +
      ", " +
      LONGITUDE,
      30,
      height - 18
    );


    const foto =
      canvas.toDataURL(
        "image/jpeg",
        0.82
      );


    /*
     * Kirim foto ke parent.
     *
     * Penting:
     * gunakan window.parent,
     * bukan window.opener.
     */

    if (
      window.parent &&
      window.parent !== window
    ) {

      window.parent.postMessage(

        {

          type:
            "KAMERA_TPA_RESULT",

          foto: {

            data:
              foto,

            type:
              "image/jpeg",

            nama:
              "FOTO-" +
              Date.now() +
              ".jpg"

          },

          koordinat: {

            latitude:
              LATITUDE,

            longitude:
              LONGITUDE

          }

        },

        "*"

      );


      status.innerText =
        "✅ Foto dikirim.";

    }

  };


/* =====================================================
   START
===================================================== */

setLokasi();


window.addEventListener(
  "load",
  function() {

    daftarKamera();

  }
);


</script>


</body>

</html>
