<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Kamera TPA Wonokerto</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      background: #111;

      color: white;

      font-family: Arial, sans-serif;

    }


    .container {

      max-width: 700px;

      margin: auto;

    }


    h1 {

      text-align: center;

      font-size: 24px;

      margin-bottom: 20px;

    }


    select,
    button {

      width: 100%;

      padding: 14px;

      margin-top: 12px;

      border-radius: 8px;

      border: 0;

      font-size: 16px;

    }


    select {

      background: white;

      color: #111;

    }


    button {

      background: #1976d2;

      color: white;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      background: #555;

      cursor: not-allowed;

    }


    #capture {

      background: #2e7d32;

    }


    video {

      display: block;

      width: 100%;

      max-height: 70vh;

      object-fit: contain;

      background: black;

      border-radius: 10px;

      margin-top: 15px;

    }


    canvas {

      display: none;

    }


    #status {

      margin-top: 15px;

      padding: 12px;

      background: #222;

      border-radius: 8px;

      text-align: center;

      line-height: 1.5;

    }


    #location {

      margin-top: 10px;

      padding: 10px;

      background: #222;

      border-radius: 8px;

      text-align: center;

      color: #ccc;

      font-size: 14px;

      line-height: 1.5;

    }


    .stamp-info {

      margin-top: 12px;

      padding: 12px;

      background: #1c1c1c;

      border-radius: 8px;

      font-size: 14px;

      line-height: 1.5;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📷 KAMERA TPA WONOKERTO
  </h1>


  <!-- =================================================
       PILIH KAMERA
       ================================================= -->

  <select id="cameraSelect">

    <option value="">
      Memuat kamera...
    </option>

  </select>


  <!-- =================================================
       BUKA KAMERA
       ================================================= -->

  <button
    id="openCamera"
    type="button">

    🎥 BUKA KAMERA

  </button>


  <!-- =================================================
       VIDEO
       ================================================= -->

  <video
    id="video"
    autoplay
    playsinline>
  </video>


  <!-- =================================================
       AMBIL FOTO
       ================================================= -->

  <button
    id="capture"
    type="button"
    disabled>

    📷 AMBIL FOTO

  </button>


  <!-- =================================================
       CANVAS
       ================================================= -->

  <canvas id="canvas"></canvas>


  <!-- =================================================
       STATUS
       ================================================= -->

  <div id="status">

    Kamera belum dibuka.

  </div>


  <!-- =================================================
       KOORDINAT
       ================================================= -->

  <div id="location">

    📍
    Koordinat tetap TPA Wonokerto:
    <br>

    -7.641230, 112.764780

  </div>


  <!-- =================================================
       INFO STAMP
       ================================================= -->

  <div class="stamp-info">

    📌 Foto akan diberi stamp:

    <br>

    <b>TPA WONOKERTO</b>

    <br>

    Latitude:
    <b>-7.641230</b>

    <br>

    Longitude:
    <b>112.764780</b>

    <br>

    Tanggal dan waktu pengambilan foto

  </div>


</div>



<script>


/* =====================================================
   VARIABEL
   ===================================================== */


let stream = null;


/* =====================================================
   KOORDINAT TETAP TPA WONOKERTO
   ===================================================== */

const FIXED_LATITUDE =
  "-7.641230";


const FIXED_LONGITUDE =
  "112.764780";



/* =====================================================
   RETURN URL
   ===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const returnUrl =
  params.get(
    "returnUrl"
  );



/* =====================================================
   ELEMENT
   ===================================================== */

const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );


const openCamera =
  document.getElementById(
    "openCamera"
  );


const capture =
  document.getElementById(
    "capture"
  );


const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const status =
  document.getElementById(
    "status"
  );


const locationText =
  document.getElementById(
    "location"
  );



/* =====================================================
   CEK BROWSER
   ===================================================== */

function cekKameraBrowser() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    status.innerText =
      "❌ Browser tidak mendukung akses kamera.";

    return false;

  }

  return true;

}



/* =====================================================
   DAFTAR KAMERA
   ===================================================== */

async function daftarKamera() {


  if (!cekKameraBrowser()) {

    return;

  }


  try {


    status.innerText =
      "⏳ Meminta izin kamera...";


    /*
     * Meminta izin kamera terlebih dahulu.
     *
     * Ini diperlukan agar browser
     * memberikan nama perangkat kamera.
     */

    const temporaryStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: true,

          audio: false

        });


    /*
     * Kamera sementara langsung
     * dimatikan.
     */

    temporaryStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    /*
     * Ambil daftar kamera.
     */

    const devices =
      await navigator.mediaDevices
        .enumerateDevices();


    cameraSelect.innerHTML =
      "";


    const defaultOption =
      document.createElement(
        "option"
      );


    defaultOption.value =
      "";


    defaultOption.textContent =
      "Pilih kamera";


    cameraSelect.appendChild(
      defaultOption
    );


    let nomor =
      1;


    devices.forEach(
      function(device) {


        if (
          device.kind !==
          "videoinput"
        ) {

          return;

        }


        const option =
          document.createElement(
            "option"
          );


        option.value =
          device.deviceId;


        option.textContent =
          device.label ||
          "Kamera " +
          nomor;


        cameraSelect.appendChild(
          option
        );


        nomor++;

      }
    );


    const jumlahKamera =
      devices.filter(
        function(device) {

          return (
            device.kind ===
            "videoinput"
          );

        }
      ).length;


    if (jumlahKamera === 0) {

      status.innerText =
        "❌ Tidak ada kamera ditemukan.";

      return;

    }


    status.innerText =
      "✅ " +
      jumlahKamera +
      " kamera ditemukan. Silakan pilih kamera.";

  }


  catch (error) {


    console.error(
      "Gagal daftar kamera:",
      error
    );


    status.innerText =
      "❌ Kamera ditolak / tidak dapat diakses: " +
      error.name +
      " - " +
      error.message;

  }

}



/* =====================================================
   BUKA KAMERA
   ===================================================== */

openCamera.onclick =
  async function() {


    if (
      !cekKameraBrowser()
    ) {

      return;

    }


    const deviceId =
      cameraSelect.value;


    try {


      /*
       * Matikan stream lama
       * jika ada.
       */

      if (stream) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

        stream =
          null;

      }


      /*
       * Jika kamera dipilih,
       * gunakan kamera tersebut.
       *
       * Jika belum memilih,
       * gunakan kamera belakang.
       */

      const constraints = {

        video:

          deviceId

            ? {

                deviceId: {

                  exact:
                    deviceId

                }

              }

            : {

                facingMode:
                  {
                    ideal:
                      "environment"
                  }

              },

        audio:
          false

      };


      status.innerText =
        "⏳ Membuka kamera...";


      /*
       * Buka kamera.
       */

      stream =
        await navigator
          .mediaDevices
          .getUserMedia(
            constraints
          );


      /*
       * Hubungkan kamera
       * ke video.
       */

      video.srcObject =
        stream;


      /*
       * Pastikan video berjalan.
       */

      try {

        await video.play();

      }

      catch (e) {

        console.log(
          "Video play:",
          e
        );

      }


      /*
       * Aktifkan tombol foto.
       */

      capture.disabled =
        false;


      status.innerText =
        "✅ Kamera aktif. Silakan arahkan kamera lalu tekan AMBIL FOTO.";


      /*
       * Koordinat tidak mengambil
       * GPS perangkat.
       */

      locationText.innerHTML =

        "📍 <b>KOORDINAT TETAP TPA WONOKERTO</b>" +
        "<br>" +
        "Latitude: " +
        FIXED_LATITUDE +
        "<br>" +
        "Longitude: " +
        FIXED_LONGITUDE;


    }


    catch (error) {


      console.error(
        "Gagal membuka kamera:",
        error
      );


      capture.disabled =
        true;


      status.innerText =
        "❌ Kamera gagal dibuka: " +
        error.name +
        " - " +
        error.message;

    }

  };



/* =====================================================
   FORMAT TANGGAL DAN WAKTU
   ===================================================== */

function formatTanggalWaktu() {


  const sekarang =
    new Date();


  const tanggal =
    sekarang.toLocaleDateString(
      "id-ID",
      {

        day: "2-digit",

        month: "2-digit",

        year: "numeric"

      }
    );


  const waktu =
    sekarang.toLocaleTimeString(
      "id-ID",
      {

        hour: "2-digit",

        minute: "2-digit",

        second: "2-digit",

        hour12: false

      }
    );


  return (
    tanggal +
    " " +
    waktu
  );

}



/* =====================================================
   AMBIL FOTO
   ===================================================== */

capture.onclick =
  function() {


    /*
     * Pastikan kamera aktif.
     */

    if (!stream) {

      status.innerText =
        "❌ Kamera belum dibuka.";

      return;

    }


    /*
     * Ambil ukuran asli video.
     */

    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if (
      !width ||
      !height
    ) {

      status.innerText =
        "❌ Kamera belum siap. Tunggu beberapa detik lalu coba lagi.";

      return;

    }


    /*
     * Atur ukuran canvas
     * sama dengan foto kamera.
     */

    canvas.width =
      width;


    canvas.height =
      height;


    const context =
      canvas.getContext(
        "2d"
      );


    /*
     * Gambar foto kamera
     * ke canvas.
     */

    context.drawImage(

      video,

      0,

      0,

      width,

      height

    );


    /* =================================================
       STAMP FOTO
       ================================================= */


    const tanggalWaktu =
      formatTanggalWaktu();


    /*
     * Ukuran tulisan menyesuaikan
     * resolusi foto.
     */

    const fontSize =
      Math.max(

        22,

        Math.round(
          width *
          0.028
        )

      );


    const padding =
      Math.round(
        fontSize *
        0.7
      );


    const lineHeight =
      Math.round(
        fontSize *
        1.35
      );


    /*
     * Tiga baris:
     *
     * TPA WONOKERTO
     * Lat / Long
     * Waktu
     */

    const stampHeight =
      padding * 2 +
      lineHeight * 3;


    /*
     * Background stamp.
     */

    context.fillStyle =
      "rgba(0, 0, 0, 0.72)";


    context.fillRect(

      0,

      height -
        stampHeight,

      width,

      stampHeight

    );


    /*
     * Warna tulisan.
     */

    context.fillStyle =
      "#ffffff";


    /*
     * Font.
     */

    context.font =
      "bold " +
      fontSize +
      "px Arial";


    context.textAlign =
      "left";


    context.textBaseline =
      "top";


    const x =
      padding;


    const y =
      height -
      stampHeight +
      padding;


    /*
     * BARIS 1
     */

    context.fillText(

      "TPA WONOKERTO",

      x,

      y

    );


    /*
     * BARIS 2
     */

    context.fillText(

      "Lat: " +
      FIXED_LATITUDE +
      "   Long: " +
      FIXED_LONGITUDE,

      x,

      y +
      lineHeight

    );


    /*
     * BARIS 3
     */

    context.fillText(

      "Waktu: " +
      tanggalWaktu,

      x,

      y +
      lineHeight * 2

    );


    /* =================================================
       KONVERSI KE JPEG
       ================================================= */


    const foto =
      canvas.toDataURL(

        "image/jpeg",

        0.82

      );


    /*
     * Pastikan hasil foto
     * benar-benar ada.
     */

    if (
      !foto ||
      foto.length < 100
    ) {

      status.innerText =
        "❌ Foto gagal dibuat.";

      return;

    }


    status.innerText =
      "⏳ Foto + stamp sedang dikirim ke Input V2...";


    /* =================================================
       CARI HALAMAN INPUT V2
       ================================================= */


    const target =
      window.opener;


    if (
      !target ||
      target.closed
    ) {

      status.innerText =
        "❌ Halaman Input V2 tidak ditemukan. Buka kamera dari tombol BUKA KAMERA di Input V2.";

      return;

    }


    /* =================================================
       KIRIM FOTO KE INPUT V2
       ================================================= */


    try {


      target.postMessage(

        {

          type:
            "KAMERA_TPA_RESULT",


          foto: {

            data:
              foto,

            type:
              "image/jpeg",

            nama:
              "FOTO-TPA-" +
              Date.now() +
              ".jpg"

          },


          koordinat: {

            latitude:
              FIXED_LATITUDE,

            longitude:
              FIXED_LONGITUDE,

            accuracy:
              ""

          }

        },

        "*"

      );


      status.innerText =
        "✅ Foto + stamp berhasil dikirim ke Input V2.";


    }


    catch (error) {


      console.error(
        "Gagal postMessage:",
        error
      );


      status.innerText =
        "❌ Gagal mengirim foto ke Input V2: " +
        error.message;


      return;

    }


    /* =================================================
       MATIKAN KAMERA
       ================================================= */


    if (stream) {


      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );


      stream =
        null;

    }


    video.srcObject =
      null;


    capture.disabled =
      true;


    /* =================================================
       TUTUP WINDOW KAMERA
       ================================================= */

    setTimeout(

      function() {

        window.close();

      },

      800

    );

  };



/* =====================================================
   SAAT HALAMAN DITUTUP
   ===================================================== */

window.addEventListener(
  "beforeunload",
  function() {


    if (stream) {


      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );


      stream =
        null;

    }

  }
);



/* =====================================================
   MULAI
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    daftarKamera();

  }
);


</script>

</body>

</html>
