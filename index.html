<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Kamera TPA Wonokerto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      border: 0;
      font-size: 16px;
    }

    select {
      background: white;
      color: #111;
    }

    button {
      background: #1976d2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #capture {
      background: #2e7d32;
    }

    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background: black;
      border-radius: 10px;
      margin-top: 15px;
    }

    canvas {
      display: none;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      background: #222;
      border-radius: 8px;
      text-align: center;
    }

    #location {
      margin-top: 10px;
      text-align: center;
      color: #ccc;
      font-size: 14px;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>📷 KAMERA TPA WONOKERTO</h1>

  <select id="cameraSelect">

    <option value="">
      Pilih kamera
    </option>

  </select>

  <button
    id="openCamera">
    🎥 BUKA KAMERA
  </button>

  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <button
    id="capture"
    disabled>
    📷 AMBIL FOTO
  </button>

  <canvas id="canvas"></canvas>

  <div id="status">
    Kamera belum dibuka.
  </div>

  <div id="location">
    📍 Koordinat belum tersedia
  </div>

</div>


<script>

  let stream = null;

  let returnUrl = null;

  let latitude = "";

  let longitude = "";


  /* =====================================================
     RETURN URL
     ===================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  returnUrl =
    params.get(
      "returnUrl"
    );


  /* =====================================================
     ELEMENT
     ===================================================== */

  const cameraSelect =
    document.getElementById(
      "cameraSelect"
    );

  const openCamera =
    document.getElementById(
      "openCamera"
    );

  const capture =
    document.getElementById(
      "capture"
    );

  const video =
    document.getElementById(
      "video"
    );

  const canvas =
    document.getElementById(
      "canvas"
    );

  const status =
    document.getElementById(
      "status"
    );

  const locationText =
    document.getElementById(
      "location"
    );


  /* =====================================================
     DAFTAR KAMERA
     ===================================================== */

  async function daftarKamera() {

    try {

      /*
       * Minta izin kamera terlebih dahulu.
       *
       * Ini penting agar browser memberikan
       * label kamera.
       */
      const temporaryStream =
        await navigator.mediaDevices
          .getUserMedia({
            video: true,
            audio: false
          });


      temporaryStream
        .getTracks()
        .forEach(
          track => track.stop()
        );


      const devices =
        await navigator.mediaDevices
          .enumerateDevices();


      cameraSelect.innerHTML =
        '<option value="">Pilih kamera</option>';


      let nomor = 1;


      devices.forEach(
        function(device) {

          if (
            device.kind !==
            "videoinput"
          ) {
            return;
          }


          const option =
            document.createElement(
              "option"
            );


          option.value =
            device.deviceId;


          option.textContent =
            device.label ||
            "Kamera " +
            nomor;


          cameraSelect.appendChild(
            option
          );


          nomor++;

        }
      );


      status.innerText =
        "Silakan pilih kamera.";

    }

    catch(error) {

      status.innerText =
        "❌ Kamera ditolak / tidak dapat diakses: " +
        error.message;

    }

  }


  /* =====================================================
     BUKA KAMERA
     ===================================================== */

  openCamera.onclick =
    async function() {

      const deviceId =
        cameraSelect.value;


      try {

        if (stream) {

          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );

        }


        const constraints = {

          video:
            deviceId

              ? {
                  deviceId: {
                    exact:
                      deviceId
                  }
                }

              : {
                  facingMode:
                    "environment"
                },

          audio: false

        };


        stream =
          await navigator
            .mediaDevices
            .getUserMedia(
              constraints
            );


        video.srcObject =
          stream;


        capture.disabled =
          false;


        status.innerText =
          "✅ Kamera aktif. Silakan ambil foto.";


        ambilLokasi();

      }

      catch(error) {

        status.innerText =
          "❌ Kamera gagal dibuka: " +
          error.message;

      }

    };


  /* =====================================================
     LOKASI
     ===================================================== */

  function ambilLokasi() {

    if (
      !navigator.geolocation
    ) {

      locationText.innerText =
        "📍 GPS tidak tersedia.";

      return;

    }


    navigator.geolocation
      .getCurrentPosition(

        function(position) {

          latitude =
            position.coords.latitude;

          longitude =
            position.coords.longitude;


          locationText.innerText =
            "📍 " +
            latitude +
            ", " +
            longitude;

        },

        function() {

          locationText.innerText =
            "📍 Lokasi tidak diizinkan.";

        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

  }


  /* =====================================================
     AMBIL FOTO
     ===================================================== */

  capture.onclick =
    function() {

      if (!stream) {

        alert(
          "Kamera belum dibuka."
        );

        return;

      }


      const width =
        video.videoWidth;

      const height =
        video.videoHeight;


      if (
        !width ||
        !height
      ) {

        alert(
          "Kamera belum siap."
        );

        return;

      }


      canvas.width =
        width;

      canvas.height =
        height;


      const context =
        canvas.getContext(
          "2d"
        );


      context.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      /*
       * Kompres JPEG agar ukuran
       * data tidak terlalu besar.
       */
      const foto =
        canvas.toDataURL(
          "image/jpeg",
          0.82
        );


      status.innerText =
        "⏳ Foto berhasil diambil. Mengirim kembali...";


      /*
       * Kirim hasil ke halaman
       * InputV2.
       *
       * Bila halaman InputV2 dibuka
       * di tab/window lain, opener
       * akan digunakan.
       */
      const target =
        window.opener;


      if (
        !target ||
        target.closed
      ) {

        status.innerText =
          "❌ Halaman Input V2 tidak ditemukan. Buka kamera dari Input V2.";

        return;

      }


      target.postMessage(

        {

          type:
            "KAMERA_TPA_RESULT",

          foto: {

            data:
              foto,

            type:
              "image/jpeg",

            nama:
              "FOTO-" +
              Date.now() +
              ".jpg"

          },

          koordinat: {

            latitude:
              latitude,

            longitude:
              longitude

          }

        },

        "*"

      );


      status.innerText =
        "✅ Foto sudah dikirim ke Input V2.";


      /*
       * Tutup kamera setelah
       * foto berhasil dikirim.
       */
      if (stream) {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      }


      /*
       * Kembali ke Input V2.
       */
      setTimeout(
        function() {

          window.close();

        },
        700
      );

    };


  /* =====================================================
     START
     ===================================================== */

  window.addEventListener(
    "load",
    daftarKamera
  );

</script>

</body>
</html>
