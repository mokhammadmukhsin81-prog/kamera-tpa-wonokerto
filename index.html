<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    Kamera TPA Wonokerto
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #062b40;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 20px;
    }

    .title {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .status {
      background: #e8f3fa;
      color: #123;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 17px;
    }

    select,
    button {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      padding: 10px 15px;
      margin-bottom: 12px;
    }

    select {
      background: white;
      color: #111;
    }

    button {
      background: #15945c;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #117b4c;
    }

    button:disabled {
      background: #666;
      cursor: not-allowed;
    }

    .video-box {
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 5px;
      margin-bottom: 12px;
    }

    video {
      width: 100%;
      height: auto;
      max-height: 600px;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .location {
      background: #edf8e8;
      color: #176b39;
      padding: 13px;
      border-radius: 9px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    canvas {
      display: none;
    }

    .small {
      text-align: center;
      opacity: .8;
      font-size: 14px;
      margin-top: 15px;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="title">
    📹 KAMERA TPA WONOKERTO
  </div>


  <div
    id="status"
    class="status">

    ⏳ Menyiapkan kamera...

  </div>


  <select id="cameraSelect">

    <option value="">
      Memilih kamera...
    </option>

  </select>


  <button id="openCamera">

    📹 BUKA KAMERA

  </button>


  <div class="video-box">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>

  </div>


  <div
    id="location"
    class="location">

    📍 Koordinat TPA:
    -7.641230, 112.764780

  </div>


  <button
    id="capture"
    disabled>

    📸 AMBIL FOTO

  </button>


  <div class="small">

    Kamera ini digunakan sebagai sumber LIVE MONITORING
    dashboard TPA Wonokerto.

  </div>

</div>


<canvas id="canvas"></canvas>


<script>

"use strict";


/* =====================================================
   VARIABEL
===================================================== */

let stream = null;

let latitude = -7.641230;
let longitude = 112.764780;

let liveTimer = null;

let kameraSiap = false;


const cameraSelect =
  document.getElementById("cameraSelect");

const openCamera =
  document.getElementById("openCamera");

const capture =
  document.getElementById("capture");

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const status =
  document.getElementById("status");

const locationText =
  document.getElementById("location");


/* =====================================================
   TAMPILKAN LOKASI
===================================================== */

function tampilkanLokasi() {

  locationText.innerText =
    "📍 Koordinat TPA: " +
    latitude.toFixed(6) +
    ", " +
    longitude.toFixed(6);

}


/* =====================================================
   DAFTAR KAMERA
===================================================== */

async function daftarKamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung akses kamera."
      );

    }


    /*
     * Minta izin kamera terlebih dahulu.
     * Setelah izin diberikan, nama kamera
     * akan dapat dibaca oleh enumerateDevices().
     */

    const temporaryStream =
      await navigator.mediaDevices.getUserMedia({

        video: true,

        audio: false

      });


    temporaryStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });


    const devices =
      await navigator.mediaDevices.enumerateDevices();


    cameraSelect.innerHTML =
      "";


    const defaultOption =
      document.createElement("option");

    defaultOption.value = "";

    defaultOption.textContent =
      "Pilih kamera...";

    cameraSelect.appendChild(
      defaultOption
    );


    let nomor = 1;

    let jumlahKamera = 0;


    devices.forEach(function(device) {

      if (
        device.kind !== "videoinput"
      ) {

        return;

      }


      jumlahKamera++;


      const option =
        document.createElement("option");


      option.value =
        device.deviceId;


      option.textContent =
        device.label ||
        "Kamera " + nomor;


      cameraSelect.appendChild(
        option
      );


      nomor++;

    });


    if (jumlahKamera === 0) {

      status.innerText =
        "❌ Tidak ada kamera ditemukan.";

      return;

    }


    status.innerText =
      "✅ " +
      jumlahKamera +
      " kamera ditemukan. Silakan pilih kamera.";


  }

  catch(error) {

    console.error(error);


    status.innerText =
      "❌ Kamera tidak dapat diakses: " +
      error.message;

  }

}


/* =====================================================
   BUKA KAMERA
===================================================== */

openCamera.addEventListener(
  "click",
  async function() {

    try {

      /*
       * Hentikan kamera lama.
       */

      hentikanKamera();


      const deviceId =
        cameraSelect.value;


      let constraints;


      if (deviceId) {

        constraints = {

          video: {

            deviceId: {

              exact: deviceId

            },

            width: {

              ideal: 1280

            },

            height: {

              ideal: 720

            }

          },

          audio: false

        };

      }

      else {

        constraints = {

          video: {

            facingMode: "environment",

            width: {

              ideal: 1280

            },

            height: {

              ideal: 720

            }

          },

          audio: false

        };

      }


      stream =
        await navigator.mediaDevices.getUserMedia(
          constraints
        );


      video.srcObject =
        stream;


      await video.play();


      kameraSiap = true;


      capture.disabled =
        false;


      status.innerText =
        "🟢 KAMERA AKTIF — LIVE";


      tampilkanLokasi();


      /*
       * Mulai mengirim frame ke dashboard
       * jika halaman ini berada di iframe.
       */

      mulaiLive();


    }

    catch(error) {

      console.error(error);


      kameraSiap = false;


      capture.disabled =
        true;


      status.innerText =
        "❌ Kamera gagal dibuka: " +
        error.message;

    }

  }
);


/* =====================================================
   HENTIKAN KAMERA
===================================================== */

function hentikanKamera() {

  if (!stream) {

    return;

  }


  stream
    .getTracks()
    .forEach(function(track) {

      track.stop();

    });


  stream = null;

  kameraSiap = false;

}


/* =====================================================
   LIVE KE DASHBOARD
===================================================== */

function mulaiLive() {

  /*
   * Hentikan timer lama.
   */

  if (liveTimer) {

    clearInterval(liveTimer);

    liveTimer = null;

  }


  /*
   * Kirim sekitar 2 frame per detik.
   * Ini jauh lebih ringan untuk dashboard
   * dibanding mengirim 4 frame/detik.
   */

  liveTimer =
    setInterval(function() {

      kirimFrameLive();

    }, 500);

}


/* =====================================================
   KIRIM FRAME
===================================================== */

function kirimFrameLive() {

  if (!stream) {

    return;

  }


  if (!kameraSiap) {

    return;

  }


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return;

  }


  const width = 640;


  const height =
    Math.round(
      video.videoHeight *
      width /
      video.videoWidth
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext("2d", {
      alpha: false
    });


  ctx.drawImage(

    video,

    0,
    0,

    width,
    height

  );


  const frame =
    canvas.toDataURL(
      "image/jpeg",
      0.55
    );


  /*
   * Jika halaman ini dibuka langsung,
   * tidak ada parent dashboard.
   *
   * Jika halaman ini berada di iframe,
   * window.parent adalah dashboard.
   */

  if (
    window.parent &&
    window.parent !== window
  ) {

    window.parent.postMessage(

      {

        type:
          "KAMERA_LIVE_FRAME",

        frame:
          frame,

        latitude:
          latitude,

        longitude:
          longitude

      },

      "*"

    );

  }

}


/* =====================================================
   AMBIL FOTO
===================================================== */

capture.addEventListener(
  "click",
  function() {

    if (!stream) {

      status.innerText =
        "❌ Kamera belum dibuka.";

      return;

    }


    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      status.innerText =
        "❌ Kamera belum siap.";

      return;

    }


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(

      video,

      0,
      0,

      canvas.width,
      canvas.height

    );


    const foto =
      canvas.toDataURL(
        "image/jpeg",
        0.82
      );


    /*
     * Kirim foto ke halaman induk.
     */

    if (
      window.parent &&
      window.parent !== window
    ) {

      window.parent.postMessage(

        {

          type:
            "KAMERA_TPA_RESULT",

          foto: {

            data:
              foto,

            type:
              "image/jpeg",

            nama:
              "FOTO-" +
              Date.now() +
              ".jpg"

          },

          koordinat: {

            latitude:
              latitude,

            longitude:
              longitude

          }

        },

        "*"

      );


      status.innerText =
        "✅ Foto dikirim.";

    }

  }
);


/* =====================================================
   SAAT HALAMAN DITUTUP
===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    if (liveTimer) {

      clearInterval(
        liveTimer
      );

    }


    hentikanKamera();

  }
);


/* =====================================================
   START
===================================================== */

tampilkanLokasi();


window.addEventListener(
  "load",
  function() {

    daftarKamera();

  }
);

</script>

</body>

</html>
