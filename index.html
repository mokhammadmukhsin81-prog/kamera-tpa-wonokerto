<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Kamera TPA Wonokerto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 25px;
    }

    select,
    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border-radius: 8px;
      border: 0;
      font-size: 17px;
    }

    select {
      background: white;
      color: #111;
    }

    button {
      background: #1976d2;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      background: #555;
    }

    #capture {
      background: #2e7d32;
    }

    video {
      display: block;
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      background: black;
      border-radius: 10px;
      margin-top: 15px;
    }

    canvas {
      display: none;
    }

    #status {
      margin-top: 15px;
      padding: 13px;
      background: #222;
      border-radius: 8px;
      text-align: center;
      line-height: 1.5;
    }

    #location {
      margin-top: 10px;
      padding: 12px;
      background: #222;
      border-radius: 8px;
      text-align: center;
      color: #ddd;
      font-size: 14px;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📷 KAMERA TPA WONOKERTO
  </h1>


  <select id="cameraSelect">

    <option value="">
      Pilih kamera
    </option>

  </select>


  <button id="openCamera">
    🎥 BUKA KAMERA
  </button>


  <video
    id="video"
    autoplay
    playsinline>
  </video>


  <button
    id="capture"
    disabled>
    📷 AMBIL FOTO
  </button>


  <canvas id="canvas"></canvas>


  <div id="status">
    Kamera belum dibuka.
  </div>


  <div id="location">
    📍 Koordinat belum tersedia
  </div>


</div>


<script>


/* =========================================================
   VARIABEL
   ========================================================= */

let stream = null;

let latitude = "";

let longitude = "";

let accuracy = "";


/* =========================================================
   ELEMENT
   ========================================================= */

const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );


const openCamera =
  document.getElementById(
    "openCamera"
  );


const capture =
  document.getElementById(
    "capture"
  );


const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const status =
  document.getElementById(
    "status"
  );


const locationText =
  document.getElementById(
    "location"
  );


/* =========================================================
   FORMAT ANGKA
   ========================================================= */

function formatKoordinat(value) {

  if (
    value === "" ||
    value === null ||
    value === undefined
  ) {

    return "-";

  }

  return Number(value)
    .toFixed(6);

}


/* =========================================================
   FORMAT TANGGAL
   ========================================================= */

function formatTanggalWaktu(date) {

  const pad =
    function(number) {

      return String(number)
        .padStart(2, "0");

    };


  return (

    pad(date.getDate()) +
    "/" +
    pad(date.getMonth() + 1) +
    "/" +
    date.getFullYear() +

    " " +

    pad(date.getHours()) +
    ":" +
    pad(date.getMinutes()) +
    ":" +
    pad(date.getSeconds())

  );

}


/* =========================================================
   DAFTAR KAMERA
   ========================================================= */

async function daftarKamera() {

  try {


    status.innerText =
      "⏳ Meminta izin kamera...";


    const temporaryStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: true,

          audio: false

        });


    temporaryStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    const devices =
      await navigator.mediaDevices
        .enumerateDevices();


    cameraSelect.innerHTML =
      '<option value="">Pilih kamera</option>';


    let nomor =
      1;


    devices.forEach(
      function(device) {


        if (
          device.kind !==
          "videoinput"
        ) {

          return;

        }


        const option =
          document.createElement(
            "option"
          );


        option.value =
          device.deviceId;


        option.textContent =
          device.label ||
          "Kamera " +
          nomor;


        cameraSelect.appendChild(
          option
        );


        nomor++;


      }
    );


    status.innerText =
      "Silakan pilih kamera.";


  }

  catch(error) {


    status.innerText =
      "❌ Kamera tidak dapat diakses: " +
      error.message;


  }

}


/* =========================================================
   BUKA KAMERA
   ========================================================= */

openCamera.onclick =
  async function() {


    const deviceId =
      cameraSelect.value;


    try {


      if (stream) {


        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );


      }


      const constraints = {

        video:

          deviceId

            ? {

                deviceId: {

                  exact:
                    deviceId

                }

              }

            : {

                facingMode:
                  "environment"

              },

        audio:
          false

      };


      stream =
        await navigator
          .mediaDevices
          .getUserMedia(
            constraints
          );


      video.srcObject =
        stream;


      capture.disabled =
        false;


      status.innerText =
        "✅ Kamera aktif. Mengambil lokasi GPS...";


      ambilLokasi();


    }

    catch(error) {


      status.innerText =
        "❌ Kamera gagal dibuka: " +
        error.message;


    }


  };


/* =========================================================
   GPS
   ========================================================= */

function ambilLokasi() {


  if (
    !navigator.geolocation
  ) {


    locationText.innerText =
      "📍 GPS tidak tersedia.";


    return;

  }


  navigator.geolocation
    .getCurrentPosition(

      function(position) {


        latitude =
          position.coords.latitude;


        longitude =
          position.coords.longitude;


        accuracy =
          position.coords.accuracy;


        locationText.innerHTML =

          "📍 Latitude: " +
          formatKoordinat(latitude) +

          "<br>" +

          "Longitude: " +
          formatKoordinat(longitude) +

          "<br>" +

          "Akurasi: ±" +
          Math.round(accuracy) +
          " meter";


        status.innerText =
          "✅ Kamera dan GPS aktif. Silakan ambil foto.";


      },


      function(error) {


        latitude =
          "";


        longitude =
          "";


        accuracy =
          "";


        locationText.innerText =
          "📍 GPS tidak diizinkan / belum tersedia.";


        status.innerText =
          "⚠️ Kamera aktif. Foto tetap dapat diambil, tetapi koordinat tidak tersedia.";


      },


      {

        enableHighAccuracy:
          true,

        timeout:
          15000,

        maximumAge:
          0

      }

    );

}


/* =========================================================
   STAMP FOTO
   ========================================================= */

function stampFoto(
  sourceCanvas,
  tanggal
) {


  const ctx =
    sourceCanvas.getContext(
      "2d"
    );


  const width =
    sourceCanvas.width;


  const height =
    sourceCanvas.height;


  /*
   * Ukuran stamp mengikuti ukuran foto.
   */

  const ukuranDasar =
    Math.max(
      18,
      Math.round(
        width * 0.022
      )
    );


  const padding =
    Math.round(
      ukuranDasar * 0.8
    );


  const lineHeight =
    Math.round(
      ukuranDasar * 1.45
    );


  const baris = [

    "TPA WONOKERTO",

    formatTanggalWaktu(
      tanggal
    ),

    "LAT : " +
      formatKoordinat(
        latitude
      ),

    "LON : " +
      formatKoordinat(
        longitude
      ),

    "AKURASI : ±" +
      (
        accuracy !== ""
          ? Math.round(
              accuracy
            )
          : "-"
      ) +
      " m"

  ];


  const tinggiStamp =
    (
      baris.length *
      lineHeight
    ) +
    padding * 2;


  /*
   * Background hitam transparan.
   */

  ctx.fillStyle =
    "rgba(0,0,0,0.72)";


  ctx.fillRect(

    0,

    height -
      tinggiStamp,

    width,

    tinggiStamp

  );


  /*
   * Teks putih.
   */

  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    "bold " +
    ukuranDasar +
    "px Arial";


  ctx.textBaseline =
    "top";


  baris.forEach(
    function(teks, index) {


      ctx.fillText(

        teks,

        padding,

        height -
          tinggiStamp +
          padding +
          (
            index *
            lineHeight
          )

      );


    }
  );


}


/* =========================================================
   AMBIL FOTO
   ========================================================= */

capture.onclick =
  function() {


    if (!stream) {


      status.innerText =
        "❌ Kamera belum dibuka.";


      return;

    }


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if (
      !width ||
      !height
    ) {


      status.innerText =
        "❌ Kamera belum siap.";


      return;

    }


    /*
     * Pastikan video benar-benar aktif.
     */

    canvas.width =
      width;


    canvas.height =
      height;


    const context =
      canvas.getContext(
        "2d"
      );


    /*
     * Ambil gambar dari kamera.
     */

    context.drawImage(

      video,

      0,

      0,

      width,

      height

    );


    /*
     * Waktu foto.
     */

    const tanggal =
      new Date();


    /*
     * STAMP LANGSUNG KE FOTO.
     */

    stampFoto(
      canvas,
      tanggal
    );


    /*
     * JPEG hasil akhir.
     */

    const foto =
      canvas.toDataURL(
        "image/jpeg",
        0.82
      );


    status.innerText =
      "⏳ Foto sudah diberi stamp. Mengirim ke Input V2...";


    /*
     * Cari halaman InputV2.
     */

    const target =
      window.opener;


    if (
      !target ||
      target.closed
    ) {


      status.innerText =
        "❌ Input V2 tidak ditemukan. Buka kamera dari Input V2.";


      return;

    }


    /*
     * Kirim foto + koordinat.
     */

    target.postMessage(

      {

        type:
          "KAMERA_TPA_RESULT",


        foto: {

          data:
            foto,

          type:
            "image/jpeg",

          nama:
            "FOTO-TPA-WONOKERTO-" +
            Date.now() +
            ".jpg"

        },


        koordinat: {

          latitude:
            latitude,

          longitude:
            longitude,

          accuracy:
            accuracy

        }

      },

      "https://script.google.com"

    );


    /*
     * Pesan berhasil.
     */

    status.innerText =
      "✅ Foto sudah diberi stamp dan dikirim ke Input V2.";


    /*
     * Matikan kamera.
     */

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream =
      null;


    capture.disabled =
      true;


    /*
     * Tutup halaman kamera.
     */

    setTimeout(
      function() {


        try {

          window.close();

        }

        catch(error) {

          console.log(
            error
          );

        }


      },
      800
    );


  };


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
  "load",
  daftarKamera
);


</script>


</body>

</html>
