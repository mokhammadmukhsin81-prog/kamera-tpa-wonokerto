<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Kamera TPA Wonokerto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #08263a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin: 5px 0 20px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 20px;
      font-size: 18px;
    }

    select,
    button {
      width: 100%;
      min-height: 55px;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      border: none;
      font-size: 17px;
    }

    select {
      background: white;
      color: #111;
    }

    button {
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #openCamera {
      background: #168f5a;
    }

    #capture {
      background: #e93683;
    }

    #retake {
      background: #f2ad00;
    }

    #closeCamera {
      background: #777;
    }

    video,
    #photoPreview {
      display: block;
      width: 100%;
      margin-top: 15px;
      background: #000;
      border-radius: 12px;
    }

    video {
      max-height: 70vh;
      object-fit: contain;
    }

    #photoPreview {
      display: none;
    }

    canvas {
      display: none;
    }

    .status {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #f0f6fa;
      color: #123;
      font-size: 17px;
      line-height: 1.5;
    }

    .location {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #edf9ed;
      color: #145c24;
      font-size: 16px;
      line-height: 1.6;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .buttons button {
      margin-top: 12px;
    }

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      h1 {
        font-size: 23px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📷 KAMERA BUKTI PENDUKUNG
  </h1>

  <div class="subtitle">
    TPA WONOKERTO
  </div>


  <!-- =========================
       PILIH KAMERA
       ========================= -->

  <select id="cameraSelect">

    <option value="">
      Memilih kamera...
    </option>

  </select>


  <!-- =========================
       BUKA KAMERA
       ========================= -->

  <button
    id="openCamera"
  >
    📷 BUKA KAMERA
  </button>


  <!-- =========================
       VIDEO
       ========================= -->

  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>


  <!-- =========================
       FOTO HASIL
       ========================= -->

  <img
    id="photoPreview"
    alt="Foto hasil"
  >


  <!-- =========================
       TOMBOL
       ========================= -->

  <div class="buttons">

    <button
      id="capture"
      disabled
    >
      📷 AMBIL FOTO
    </button>

    <button
      id="retake"
      disabled
    >
      🔄 AMBIL ULANG
    </button>

  </div>


  <button
    id="closeCamera"
    disabled
  >
    ✖ TUTUP KAMERA
  </button>


  <!-- =========================
       CANVAS
       ========================= -->

  <canvas id="canvas"></canvas>


  <!-- =========================
       STATUS
       ========================= -->

  <div
    id="status"
    class="status"
  >
    Kamera belum dibuka.
  </div>


  <!-- =========================
       LOKASI
       ========================= -->

  <div
    id="location"
    class="location"
  >

    📍 <b>KOORDINAT</b>

    <br>

    Latitude:
    <span id="latitude">-</span>

    <br>

    Longitude:
    <span id="longitude">-</span>

    <br>

    Akurasi:
    <span id="accuracy">-</span>

  </div>


</div>


<script>


/* =========================================================
   VARIABEL
   ========================================================= */

let stream = null;

let fotoSudahDiambil = false;

let latitude = "";

let longitude = "";

let accuracy = "";


/* =========================================================
   PARAMETER
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


/*
 * InputV2 akan membuka halaman ini
 * dengan:
 *
 * ?return=inputv2
 *
 * Parameter ini hanya sebagai penanda.
 */

const returnPage =
  params.get("return");


/* =========================================================
   ELEMENT
   ========================================================= */

const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );

const openCamera =
  document.getElementById(
    "openCamera"
  );

const capture =
  document.getElementById(
    "capture"
  );

const retake =
  document.getElementById(
    "retake"
  );

const closeCamera =
  document.getElementById(
    "closeCamera"
  );

const video =
  document.getElementById(
    "video"
  );

const canvas =
  document.getElementById(
    "canvas"
  );

const photoPreview =
  document.getElementById(
    "photoPreview"
  );

const status =
  document.getElementById(
    "status"
  );

const latitudeEl =
  document.getElementById(
    "latitude"
  );

const longitudeEl =
  document.getElementById(
    "longitude"
  );

const accuracyEl =
  document.getElementById(
    "accuracy"
  );


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text) {

  status.innerText =
    text;

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

  if (!stream) {
    return;
  }

  stream
    .getTracks()
    .forEach(
      function(track) {
        track.stop();
      }
    );

  stream = null;

  video.srcObject =
    null;

  capture.disabled =
    true;

  closeCamera.disabled =
    true;

}


/* =========================================================
   DAFTAR KAMERA
   ========================================================= */

async function daftarKamera() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    setStatus(
      "❌ Browser tidak mendukung akses kamera."
    );

    return;

  }


  try {

    /*
     * Minta izin sekali.
     */

    const temporaryStream =
      await navigator.mediaDevices
        .getUserMedia({
          video: true,
          audio: false
        });


    /*
     * Setelah izin didapat,
     * matikan stream sementara.
     */

    temporaryStream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );


    /*
     * Ambil daftar kamera.
     */

    const devices =
      await navigator.mediaDevices
        .enumerateDevices();


    cameraSelect.innerHTML =
      "";


    const defaultOption =
      document.createElement(
        "option"
      );

    defaultOption.value =
      "";

    defaultOption.textContent =
      "Pilih kamera";

    cameraSelect.appendChild(
      defaultOption
    );


    let nomor =
      1;


    devices.forEach(
      function(device) {

        if (
          device.kind !==
          "videoinput"
        ) {
          return;
        }


        const option =
          document.createElement(
            "option"
          );


        option.value =
          device.deviceId;


        option.textContent =
          device.label ||
          "Kamera " +
          nomor;


        cameraSelect.appendChild(
          option
        );


        nomor++;

      }
    );


    if (
      cameraSelect.options.length <= 1
    ) {

      setStatus(
        "❌ Tidak ada kamera yang ditemukan."
      );

      return;

    }


    /*
     * Pilih kamera pertama
     * secara otomatis.
     */

    cameraSelect.selectedIndex =
      1;


    setStatus(
      "✅ Kamera tersedia. Tekan BUKA KAMERA."
    );

  }

  catch(error) {

    console.error(error);

    setStatus(
      "❌ Izin kamera ditolak atau kamera tidak dapat diakses: " +
      error.name +
      " - " +
      error.message
    );

  }

}


/* =========================================================
   BUKA KAMERA
   ========================================================= */

openCamera.onclick =
  async function() {

    try {

      /*
       * Tutup stream sebelumnya.
       */

      stopCamera();


      let deviceId =
        cameraSelect.value;


      /*
       * Jika belum memilih kamera,
       * gunakan kamera belakang.
       */

      let constraints;


      if (deviceId) {

        constraints = {

          video: {
            deviceId: {
              exact: deviceId
            }
          },

          audio: false

        };

      }

      else {

        constraints = {

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        };

      }


      setStatus(
        "⏳ Membuka kamera..."
      );


      stream =
        await navigator.mediaDevices
          .getUserMedia(
            constraints
          );


      video.srcObject =
        stream;


      await video.play();


      capture.disabled =
        false;

      closeCamera.disabled =
        false;


      setStatus(
        "✅ Kamera aktif. Arahkan kamera lalu tekan AMBIL FOTO."
      );


      /*
       * Ambil lokasi bersamaan
       * dengan kamera.
       */

      ambilLokasi();

    }

    catch(error) {

      console.error(error);

      capture.disabled =
        true;

      setStatus(
        "❌ Kamera gagal dibuka: " +
        error.name +
        " - " +
        error.message
      );

    }

  };


/* =========================================================
   LOKASI
   ========================================================= */

function ambilLokasi() {

  if (
    !navigator.geolocation
  ) {

    latitude = "";
    longitude = "";
    accuracy = "";

    latitudeEl.innerText =
      "-";

    longitudeEl.innerText =
      "-";

    accuracyEl.innerText =
      "GPS tidak tersedia";

    return;

  }


  latitudeEl.innerText =
    "Mengambil...";

  longitudeEl.innerText =
    "Mengambil...";

  accuracyEl.innerText =
    "Mengambil...";


  navigator.geolocation
    .getCurrentPosition(

      function(position) {

        latitude =
          position.coords.latitude;

        longitude =
          position.coords.longitude;

        accuracy =
          position.coords.accuracy;


        latitudeEl.innerText =
          latitude;

        longitudeEl.innerText =
          longitude;

        accuracyEl.innerText =
          accuracy +
          " meter";

      },

      function(error) {

        console.error(
          "GPS:",
          error
        );


        latitude =
          "";

        longitude =
          "";

        accuracy =
          "";


        latitudeEl.innerText =
          "-";

        longitudeEl.innerText =
          "-";

        accuracyEl.innerText =
          "Lokasi tidak diizinkan";


      },

      {

        enableHighAccuracy:
          true,

        timeout:
          15000,

        maximumAge:
          0

      }

    );

}


/* =========================================================
   AMBIL FOTO
   ========================================================= */

capture.onclick =
  function() {

    if (!stream) {

      alert(
        "Kamera belum dibuka."
      );

      return;

    }


    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      alert(
        "Kamera belum siap. Tunggu beberapa detik."
      );

      return;

    }


    const width =
      video.videoWidth;

    const height =
      video.videoHeight;


    canvas.width =
      width;

    canvas.height =
      height;


    const context =
      canvas.getContext(
        "2d"
      );


    context.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    /*
     * JPEG dikompres supaya
     * pengiriman ke Apps Script
     * tidak terlalu besar.
     */

    const foto =
      canvas.toDataURL(
        "image/jpeg",
        0.82
      );


    /*
     * Tampilkan preview.
     */

    photoPreview.src =
      foto;

    photoPreview.style.display =
      "block";


    fotoSudahDiambil =
      true;


    retake.disabled =
      false;


    setStatus(
      "⏳ Foto berhasil diambil. Mengirim ke InputV2..."
    );


    /*
     * Kirim ke window pembuka.
     *
     * InputV2 membuka halaman ini
     * menggunakan window.open().
     */

    const target =
      window.opener;


    if (
      !target ||
      target.closed
    ) {

      setStatus(
        "❌ InputV2 tidak ditemukan. Buka kamera dari tombol BUKA KAMERA di InputV2."
      );

      return;

    }


    /*
     * Data foto + koordinat.
     */

    target.postMessage(

      {

        type:
          "KAMERA_TPA_RESULT",

        foto: {

          data:
            foto,

          type:
            "image/jpeg",

          nama:
            "BUKTI-TPA-" +
            Date.now() +
            ".jpg"

        },

        koordinat: {

          latitude:
            latitude,

          longitude:
            longitude,

          accuracy:
            accuracy

        }

      },

      "https://script.google.com"

    );


    /*
     * Jika target origin di browser
     * berbeda karena Apps Script memakai
     * usercode/exec domain, kirim ulang
     * dengan wildcard sebagai fallback.
     *
     * Tidak mengirim data ke server lain;
     * hanya ke window.opener.
     */

    try {

      target.postMessage(

        {

          type:
            "KAMERA_TPA_RESULT",

          foto: {

            data:
              foto,

            type:
              "image/jpeg",

            nama:
              "BUKTI-TPA-" +
              Date.now() +
              ".jpg"

          },

          koordinat: {

            latitude:
              latitude,

            longitude:
              longitude,

            accuracy:
              accuracy

          }

        },

        "*"

      );

    }

    catch(error) {

      console.error(error);

    }


    setStatus(
      "✅ Foto sudah dikirim ke InputV2. Silakan kembali ke halaman InputV2."
    );


    /*
     * Matikan kamera.
     */

    stopCamera();

  };


/* =========================================================
   AMBIL ULANG
   ========================================================= */

retake.onclick =
  function() {

    photoPreview.src =
      "";

    photoPreview.style.display =
      "none";


    fotoSudahDiambil =
      false;


    retake.disabled =
      true;


    setStatus(
      "Kamera siap. Tekan BUKA KAMERA untuk mengambil foto lagi."
    );


    openCamera.click();

  };


/* =========================================================
   TUTUP KAMERA
   ========================================================= */

closeCamera.onclick =
  function() {

    stopCamera();

    setStatus(
      "Kamera ditutup."
    );

  };


/* =========================================================
   SAAT HALAMAN DITUTUP
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    stopCamera();

  }
);


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    daftarKamera();

  }
);


</script>


</body>

</html>
