<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kamera TPA Wonokerto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #06283d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(900px, 94%);
      margin: 20px auto;
      background: #0b3852;
      padding: 20px;
      border-radius: 18px;
    }

    h1 {
      text-align: center;
      margin: 5px 0 20px;
    }

    .status {
      background: #e8f3fb;
      color: #17364a;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      margin-bottom: 10px;
      font-size: 17px;
    }

    select {
      background: white;
      color: #222;
    }

    button {
      background: #159957;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #777;
      cursor: not-allowed;
    }

    .video-box {
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 5px;
    }

    video {
      width: 100%;
      max-height: 65vh;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .location {
      background: #eaf7e7;
      color: #17652c;
      padding: 12px;
      border-radius: 9px;
      margin-top: 12px;
      font-weight: bold;
    }

    #canvas {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📷 KAMERA TPA WONOKERTO</h1>

  <div class="status" id="status">
    Memuat kamera...
  </div>

  <select id="cameraSelect">
    <option value="">Memilih kamera...</option>
  </select>

  <button id="openCamera">
    📹 BUKA KAMERA
  </button>

  <div class="video-box">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div class="location">
    📍 Koordinat Lokasi TPA:
    -7.641230, 112.764780
  </div>

  <button id="capture" disabled>
    📸 AMBIL FOTO
  </button>

  <canvas id="canvas"></canvas>

</div>

<script>

let stream = null;
let liveTimer = null;

const latitude = -7.641230;
const longitude = 112.764780;

const params =
  new URLSearchParams(window.location.search);

const cameraSelect =
  document.getElementById("cameraSelect");

const openCamera =
  document.getElementById("openCamera");

const capture =
  document.getElementById("capture");

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const status =
  document.getElementById("status");


/* =====================================================
   DAFTAR KAMERA
===================================================== */

async function daftarKamera() {

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    status.innerText =
      "❌ Browser tidak mendukung akses kamera.";

    return;
  }

  try {

    /*
     * Minta izin kamera terlebih dahulu.
     * Ini penting agar label kamera muncul.
     */

    const temporaryStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    temporaryStream
      .getTracks()
      .forEach(function(track) {
        track.stop();
      });

    const devices =
      await navigator.mediaDevices.enumerateDevices();

    cameraSelect.innerHTML =
      '<option value="">Pilih kamera</option>';

    let nomor = 1;

    devices.forEach(function(device) {

      if (device.kind !== "videoinput") {
        return;
      }

      const option =
        document.createElement("option");

      option.value =
        device.deviceId;

      option.textContent =
        device.label ||
        "Kamera " + nomor;

      cameraSelect.appendChild(option);

      nomor++;

    });

    if (cameraSelect.options.length <= 1) {

      status.innerText =
        "❌ Kamera tidak ditemukan.";

      return;
    }

    status.innerText =
      "Pilih kamera kemudian tekan BUKA KAMERA.";

  }

  catch(error) {

    console.error(error);

    status.innerText =
      "❌ Izin kamera ditolak atau kamera tidak tersedia.";

  }
}


/* =====================================================
   BUKA KAMERA
===================================================== */

openCamera.addEventListener(
  "click",
  async function() {

    try {

      if (stream) {

        stream
          .getTracks()
          .forEach(function(track) {
            track.stop();
          });

      }

      const deviceId =
        cameraSelect.value;

      let constraints;

      if (deviceId) {

        constraints = {
          video: {
            deviceId: {
              exact: deviceId
            }
          },
          audio: false
        };

      } else {

        constraints = {
          video: {
            facingMode: "environment"
          },
          audio: false
        };

      }

      status.innerText =
        "Membuka kamera...";

      stream =
        await navigator.mediaDevices.getUserMedia(
          constraints
        );

      video.srcObject = stream;

      await video.play();

      capture.disabled = false;

      status.innerText =
        "✅ Kamera aktif.";

      /*
       * Kamera sudah aktif.
       * Kalau halaman ini dibuka oleh Dashboard,
       * kirim frame live ke Dashboard.
       */

      mulaiLive();

    }

    catch(error) {

      console.error(error);

      status.innerText =
        "❌ Kamera gagal dibuka: " +
        error.message;

    }

  }
);


/* =====================================================
   LIVE FRAME
===================================================== */

function mulaiLive() {

  if (liveTimer) {

    clearInterval(liveTimer);

  }

  liveTimer =
    setInterval(function() {

      if (!stream) {
        return;
      }

      if (!video.videoWidth ||
          !video.videoHeight) {

        return;
      }

      const width = 640;

      const height =
        Math.round(
          video.videoHeight *
          width /
          video.videoWidth
        );

      canvas.width = width;
      canvas.height = height;

      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        video,
        0,
        0,
        width,
        height
      );

      const frame =
        canvas.toDataURL(
          "image/jpeg",
          0.55
        );

      /*
       * Kirim ke halaman pembuka.
       */

      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          {
            type: "KAMERA_LIVE_FRAME",
            frame: frame
          },
          "*"
        );

      }

    }, 500);

}


/* =====================================================
   AMBIL FOTO
===================================================== */

capture.addEventListener(
  "click",
  function() {

    if (!stream) {

      status.innerText =
        "❌ Kamera belum dibuka.";

      return;

    }

    if (!video.videoWidth ||
        !video.videoHeight) {

      status.innerText =
        "❌ Kamera belum siap.";

      return;

    }

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;

    const ctx =
      canvas.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const foto =
      canvas.toDataURL(
        "image/jpeg",
        0.82
      );

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(
        {
          type: "KAMERA_TPA_RESULT",

          foto: {
            data: foto,
            type: "image/jpeg",
            nama:
              "FOTO-" +
              Date.now() +
              ".jpg"
          },

          koordinat: {
            latitude: latitude,
            longitude: longitude
          }
        },
        "*"
      );

      status.innerText =
        "✅ Foto dikirim.";

    } else {

      status.innerText =
        "📸 Foto berhasil diambil.";

    }

  }
);


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  function() {

    daftarKamera();

  }
);


/* =====================================================
   MATIKAN KAMERA SAAT HALAMAN DITUTUP
===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    if (liveTimer) {
      clearInterval(liveTimer);
    }

    if (stream) {

      stream
        .getTracks()
        .forEach(function(track) {
          track.stop();
        });

    }

  }
);

</script>

</body>
</html>
