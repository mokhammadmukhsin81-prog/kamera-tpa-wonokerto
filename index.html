<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">

  <title>Kamera TPA Wonokerto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #06263a;
      color: #ffffff;
    }

    body {
      padding: 18px;
    }

    .wrap {
      width: min(900px, 100%);
      margin: auto;
    }

    h1 {
      margin: 0 0 14px;
      text-align: center;
      font-size: 30px;
    }

    .status,
    .location {
      background: #eaf4fb;
      color: #17374c;
      border-radius: 10px;
      padding: 13px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .status.live {
      color: #08723f;
    }

    select,
    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    select {
      background: #ffffff;
      color: #222222;
    }

    button {
      background: #159957;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #777777;
      cursor: not-allowed;
    }

    .screen {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    #video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000000;
    }

    #canvas {
      display: none;
    }

    .note {
      text-align: center;
      color: #bcd0dc;
      font-size: 13px;
      margin-top: 8px;
    }

  </style>
</head>

<body>

  <div class="wrap">

    <h1>📹 KAMERA TPA WONOKERTO</h1>

    <div id="status" class="status">
      🟡 Pilih kamera lalu tekan BUKA KAMERA.
    </div>

    <select id="cameraSelect">
      <option value="">
        Memuat kamera...
      </option>
    </select>

    <button id="openCamera">
      📹 BUKA KAMERA
    </button>

    <div class="screen">
      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>
    </div>

    <div class="location">
      📍 Koordinat TPA:
      <b id="locationText">
        -7.641230, 112.764780
      </b>
    </div>

    <button
      id="capture"
      disabled>
      📸 AMBIL FOTO
    </button>

    <div class="note">
      LIVE dibuat ringan agar dashboard besar tetap responsif.
    </div>

    <canvas id="canvas"></canvas>

  </div>

<script>

/* =========================================================
   KONFIGURASI
   ========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxmJWj16HE3QXTm1mG31wMh6PbfEqgs8Sr6iGmNwOn-Bq_1r1SHQItwB_rS5z-DO2DyQw/exec";

const LATITUDE =
  -7.641230;

const LONGITUDE =
  112.764780;

/*
 * LIVE ringan:
 * 320 x 180 px
 * maksimal sekitar 2-3 frame/detik
 */
const LIVE_WIDTH =
  320;

const LIVE_INTERVAL =
  350;


/* =========================================================
   ELEMENT
   ========================================================= */

let stream = null;
let liveTimer = null;
let liveSending = false;

const params =
  new URLSearchParams(
    window.location.search
  );

const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );

const openCamera =
  document.getElementById(
    "openCamera"
  );

const capture =
  document.getElementById(
    "capture"
  );

const video =
  document.getElementById(
    "video"
  );

const canvas =
  document.getElementById(
    "canvas"
  );

const status =
  document.getElementById(
    "status"
  );


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text, live) {

  status.innerText =
    text;

  status.className =
    live
      ? "status live"
      : "status";

}


/* =========================================================
   DAFTAR KAMERA
   ========================================================= */

async function daftarKamera() {

  try {

    const tempStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          video: true,
          audio: false
        });

    tempStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    const devices =
      await navigator
        .mediaDevices
        .enumerateDevices();

    cameraSelect.innerHTML =
      '<option value="">Pilih kamera</option>';

    let nomor = 1;

    devices.forEach(
      function(device) {

        if (
          device.kind !==
          "videoinput"
        ) {
          return;
        }

        const option =
          document.createElement(
            "option"
          );

        option.value =
          device.deviceId;

        option.textContent =
          device.label ||
          "Kamera " +
          nomor;

        cameraSelect.appendChild(
          option
        );

        nomor++;

      }
    );

    setStatus(
      "Silakan pilih kamera.",
      false
    );

  }

  catch (error) {

    setStatus(
      "❌ Kamera tidak dapat diakses: " +
      error.message,
      false
    );

  }

}


/* =========================================================
   BUKA KAMERA
   ========================================================= */

openCamera.onclick =
  async function() {

    try {

      stopCamera();

      const deviceId =
        cameraSelect.value;

      const constraints = {

        video:
          deviceId
            ? {
                deviceId: {
                  exact:
                    deviceId
                }
              }
            : {
                facingMode:
                  "environment"
              },

        audio: false

      };

      stream =
        await navigator
          .mediaDevices
          .getUserMedia(
            constraints
          );

      video.srcObject =
        stream;

      capture.disabled =
        false;

      setStatus(
        "🟢 KAMERA AKTIF — LIVE",
        true
      );

      mulaiLive();

    }

    catch (error) {

      setStatus(
        "❌ Kamera gagal dibuka: " +
        error.message,
        false
      );

    }

  };


/* =========================================================
   STOP KAMERA
   ========================================================= */

function stopCamera() {

  if (liveTimer) {

    clearInterval(
      liveTimer
    );

    liveTimer = null;

  }

  if (stream) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    stream = null;

  }

  video.srcObject =
    null;

  capture.disabled =
    true;

}


/* =========================================================
   BUAT FRAME LIVE KECIL
   ========================================================= */

function buatFrameLive() {

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return null;

  }

  const width =
    LIVE_WIDTH;

  const height =
    Math.round(
      video.videoHeight *
      width /
      video.videoWidth
    );

  canvas.width =
    width;

  canvas.height =
    height;

  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha: false
      }
    );

  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );

  /*
   * Mulai dengan kualitas rendah.
   * Jika masih besar, turunkan lagi.
   */
  let quality =
    0.30;

  let frame =
    canvas.toDataURL(
      "image/jpeg",
      quality
    );

  while (
    frame.length > 60000 &&
    quality > 0.16
  ) {

    quality -= 0.03;

    frame =
      canvas.toDataURL(
        "image/jpeg",
        quality
      );

  }

  return frame;

}


/* =========================================================
   KIRIM FRAME KE GOOGLE APPS SCRIPT
   ========================================================= */

async function kirimFrameKeServer(frame) {

  if (
    liveSending ||
    !frame
  ) {
    return;
  }

  liveSending =
    true;

  try {

    const payload = {

      type:
        "LIVE_FRAME",

      frame:
        frame,

      latitude:
        LATITUDE,

      longitude:
        LONGITUDE,

      time:
        Date.now()

    };

    /*
     * text/plain menghindari preflight CORS.
     * no-cors karena dashboard tidak perlu
     * membaca jawaban POST.
     */
    await fetch(
      APPS_SCRIPT_URL,
      {
        method: "POST",
        mode: "no-cors",
        redirect: "follow",
        cache: "no-store",
        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body:
          JSON.stringify(
            payload
          )
      }
    );

  }

  catch (error) {

    console.log(
      "LIVE upload:",
      error
    );

  }

  finally {

    liveSending =
      false;

  }

}


/* =========================================================
   LIVE
   ========================================================= */

function mulaiLive() {

  if (liveTimer) {

    clearInterval(
      liveTimer
    );

  }

  liveTimer =
    setInterval(
      function() {

        if (!stream) {
          return;
        }

        const frame =
          buatFrameLive();

        if (!frame) {
          return;
        }

        /*
         * Jika Dashboard masih satu browser
         * dengan kamera, tampilkan langsung juga.
         */
        if (
          window.opener &&
          !window.opener.closed
        ) {

          try {

            window.opener.postMessage(
              {
                type:
                  "KAMERA_LIVE_FRAME",

                frame:
                  frame,

                latitude:
                  LATITUDE,

                longitude:
                  LONGITUDE,

                time:
                  Date.now()
              },
              "*"
            );

          }

          catch (error) {

            console.log(
              "postMessage:",
              error
            );

          }

        }

        /*
         * Jalur utama untuk beda laptop:
         * kamera -> Apps Script -> dashboard besar.
         */
        kirimFrameKeServer(
          frame
        );

      },
      LIVE_INTERVAL
    );

}


/* =========================================================
   AMBIL FOTO
   ========================================================= */

capture.onclick =
  function() {

    if (!stream) {

      alert(
        "Kamera belum dibuka."
      );

      return;

    }

    const width =
      video.videoWidth;

    const height =
      video.videoHeight;

    if (!width || !height) {

      alert(
        "Kamera belum siap."
      );

      return;

    }

    canvas.width =
      width;

    canvas.height =
      height;

    const ctx =
      canvas.getContext(
        "2d"
      );

    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );

    /*
     * Overlay bukti foto.
     */
    const waktu =
      new Date()
        .toLocaleString(
          "id-ID"
        );

    const boxHeight =
      92;

    ctx.fillStyle =
      "rgba(0,0,0,.68)";

    ctx.fillRect(
      0,
      height - boxHeight,
      width,
      boxHeight
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.font =
      "bold 24px Arial";

    ctx.fillText(
      "TPA WONOKERTO",
      20,
      height - 56
    );

    ctx.font =
      "17px Arial";

    ctx.fillText(
      "Lat: " +
      LATITUDE.toFixed(6) +
      " | Long: " +
      LONGITUDE.toFixed(6),
      20,
      height - 31
    );

    ctx.fillText(
      waktu,
      width - 250,
      height - 31
    );

    const foto =
      canvas.toDataURL(
        "image/jpeg",
        0.82
      );

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(
        {
          type:
            "KAMERA_TPA_RESULT",

          foto: {
            data:
              foto,

            type:
              "image/jpeg",

            nama:
              "FOTO-" +
              Date.now() +
              ".jpg"
          },

          koordinat: {
            latitude:
              LATITUDE,

            longitude:
              LONGITUDE,

            accuracy:
              ""
          }
        },
        "*"
      );

      setStatus(
        "✅ Foto dikirim ke Input V2.",
        true
      );

    }

    else {

      setStatus(
        "✅ Foto selesai diambil.",
        true
      );

    }

  };


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
  "load",
  daftarKamera
);

window.addEventListener(
  "beforeunload",
  stopCamera
);

</script>

</body>
</html>
