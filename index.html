<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kamera TPA Wonokerto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #062338;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 5px 0 20px;
      font-size: 32px;
    }

    .status {
      background: #e8f2fa;
      color: #17384f;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    select,
    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 9px;
      font-size: 18px;
      margin-bottom: 12px;
      padding: 10px 15px;
    }

    select {
      background: white;
      color: #222;
    }

    button {
      background: #159447;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      background: #777;
      cursor: not-allowed;
    }

    .video-box {
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 15px;
      width: 100%;
    }

    video {
      display: block;
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      background: black;
    }

    .location {
      background: #e9f8e9;
      color: #17642f;
      padding: 14px;
      border-radius: 9px;
      margin-top: 12px;
      font-weight: bold;
    }

    canvas {
      display: none;
    }

    .note {
      text-align: center;
      margin-top: 15px;
      opacity: .8;
      font-size: 14px;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📹 KAMERA TPA WONOKERTO
  </h1>


  <div
    class="status"
    id="status"
  >
    ⏳ Menyiapkan kamera...
  </div>


  <select id="cameraSelect">

    <option value="">
      Memilih kamera...
    </option>

  </select>


  <button
    id="openCamera"
  >
    📹 BUKA KAMERA
  </button>


  <div class="video-box">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

  </div>


  <div
    class="location"
    id="location"
  >
    📍 Koordinat lokasi TPA:
    -7.641230, 112.764780
  </div>


  <button
    id="capture"
    disabled
  >
    📸 AMBIL FOTO
  </button>


  <canvas id="canvas"></canvas>


  <div class="note">
    Kamera dan lokasi digunakan untuk monitoring
    TPA Wonokerto.
  </div>


</div>


<script>


/* =====================================================
   KONFIGURASI
===================================================== */

const LATITUDE = -7.641230;
const LONGITUDE = 112.764780;

const params =
  new URLSearchParams(
    window.location.search
  );

const isLiveMode =
  params.get("mode") === "live";


/* =====================================================
   ELEMENT
===================================================== */

const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );

const openCamera =
  document.getElementById(
    "openCamera"
  );

const capture =
  document.getElementById(
    "capture"
  );

const video =
  document.getElementById(
    "video"
  );

const canvas =
  document.getElementById(
    "canvas"
  );

const status =
  document.getElementById(
    "status"
  );


/* =====================================================
   VARIABEL
===================================================== */

let stream = null;

let liveTimer = null;


/* =====================================================
   TAMPILKAN LOKASI
===================================================== */

document.getElementById(
  "location"
).innerText =
  "📍 Koordinat lokasi TPA: " +
  LATITUDE +
  ", " +
  LONGITUDE;


/* =====================================================
   DAFTAR KAMERA
===================================================== */

async function daftarKamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung kamera."
      );

    }


    /*
     * Minta izin kamera terlebih dahulu.
     * Ini penting agar label kamera muncul.
     */

    const temporaryStream =
      await navigator.mediaDevices.getUserMedia({

        video: true,

        audio: false

      });


    temporaryStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });


    const devices =
      await navigator.mediaDevices.enumerateDevices();


    cameraSelect.innerHTML =
      "";


    const defaultOption =
      document.createElement(
        "option"
      );

    defaultOption.value = "";

    defaultOption.textContent =
      "Pilih kamera...";

    cameraSelect.appendChild(
      defaultOption
    );


    let nomor = 1;


    devices.forEach(
      function(device) {

        if (
          device.kind !==
          "videoinput"
        ) {

          return;

        }


        const option =
          document.createElement(
            "option"
          );


        option.value =
          device.deviceId;


        option.textContent =
          device.label ||
          "Kamera " + nomor;


        cameraSelect.appendChild(
          option
        );


        nomor++;

      }
    );


    status.innerText =
      "✅ Kamera siap. Pilih kamera lalu tekan BUKA KAMERA.";

  }


  catch(error) {

    console.error(error);


    status.innerText =
      "❌ Kamera tidak dapat diakses: " +
      error.message;

  }

}


/* =====================================================
   BUKA KAMERA
===================================================== */

openCamera.onclick =
  async function() {

    try {

      /*
       * Matikan stream sebelumnya.
       */

      if (stream) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

      }


      const deviceId =
        cameraSelect.value;


      let constraints;


      if (deviceId) {

        constraints = {

          video: {

            deviceId: {
              exact: deviceId
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        };

      }

      else {

        constraints = {

          video: {

            facingMode:
              "environment",

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        };

      }


      status.innerText =
        "⏳ Membuka kamera...";


      stream =
        await navigator.mediaDevices
          .getUserMedia(
            constraints
          );


      video.srcObject =
        stream;


      await video.play();


      capture.disabled =
        false;


      status.innerText =
        "🟢 KAMERA AKTIF";


      /*
       * Jika halaman dibuka oleh Dashboard,
       * mulai kirim frame ke Dashboard.
       */

      if (
        window.opener &&
        !window.opener.closed
      ) {

        mulaiLive();

      }

    }


    catch(error) {

      console.error(error);


      status.innerText =
        "❌ Kamera gagal dibuka: " +
        error.message;

    }

  };


/* =====================================================
   LIVE FRAME
===================================================== */

function mulaiLive() {

  if (liveTimer) {

    clearInterval(
      liveTimer
    );

  }


  /*
   * Kirim frame setiap 500 ms.
   * = sekitar 2 frame per detik.
   *
   * Ini jauh lebih ringan untuk
   * Dashboard Google Apps Script.
   */

  liveTimer =
    setInterval(
      function() {

        if (!stream) {
          return;
        }


        if (
          !video.videoWidth ||
          !video.videoHeight
        ) {

          return;

        }


        const width = 640;


        const height =
          Math.round(
            video.videoHeight *
            width /
            video.videoWidth
          );


        canvas.width =
          width;

        canvas.height =
          height;


        const ctx =
          canvas.getContext(
            "2d"
          );


        ctx.drawImage(

          video,

          0,
          0,

          width,
          height

        );


        const frame =
          canvas.toDataURL(

            "image/jpeg",

            0.55

          );


        try {

          window.opener.postMessage(

            {

              type:
                "KAMERA_LIVE_FRAME",

              frame:
                frame,

              latitude:
                LATITUDE,

              longitude:
                LONGITUDE

            },

            "*"

          );

        }


        catch(error) {

          console.error(
            "Gagal kirim frame:",
            error
          );

        }

      },

      500

    );

}


/* =====================================================
   AMBIL FOTO
===================================================== */

capture.onclick =
  function() {

    if (!stream) {

      alert(
        "Kamera belum dibuka."
      );

      return;

    }


    const width =
      video.videoWidth;

    const height =
      video.videoHeight;


    if (
      !width ||
      !height
    ) {

      alert(
        "Kamera belum siap."
      );

      return;

    }


    canvas.width =
      width;

    canvas.height =
      height;


    const ctx =
      canvas.getContext(
        "2d"
      );


    ctx.drawImage(

      video,

      0,
      0,

      width,
      height

    );


    const foto =
      canvas.toDataURL(

        "image/jpeg",

        0.82

      );


    /*
     * Kirim foto ke halaman
     * yang membuka kamera.
     */

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(

        {

          type:
            "KAMERA_TPA_RESULT",

          foto: {

            data:
              foto,

            type:
              "image/jpeg",

            nama:
              "FOTO-" +
              Date.now() +
              ".jpg"

          },

          koordinat: {

            latitude:
              LATITUDE,

            longitude:
              LONGITUDE

          }

        },

        "*"

      );


      status.innerText =
        "✅ Foto berhasil dikirim.";

    }

    else {

      status.innerText =
        "ℹ️ Foto berhasil diambil.";

    }

  };


/* =====================================================
   SAAT HALAMAN DIBUKA
===================================================== */

window.addEventListener(
  "load",
  function() {

    daftarKamera();

  }
);


/* =====================================================
   SAAT HALAMAN DITUTUP
===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    if (liveTimer) {

      clearInterval(
        liveTimer
      );

    }


    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }

  }
);


</script>


</body>
</html>
