<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <base target="_self">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Kamera TPA Wonokerto
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background: #edf2f6;

      color: #082a45;

    }


    .container {

      max-width: 900px;

      margin: auto;

      padding: 20px;

    }


    h1 {

      text-align: center;

      margin-top: 10px;

    }


    .card {

      background: white;

      border-radius: 14px;

      padding: 20px;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,.10);

    }


    label {

      display: block;

      font-weight: bold;

      margin-top: 15px;

      margin-bottom: 6px;

    }


    select,
    button {

      width: 100%;

      padding: 13px;

      border-radius: 8px;

      border: 1px solid #ccc;

      font-size: 16px;

    }


    button {

      margin-top: 12px;

      background: #062338;

      color: white;

      border: none;

      cursor: pointer;

      font-weight: bold;

    }


    button:disabled {

      background: #999;

      cursor: not-allowed;

    }


    #video {

      width: 100%;

      max-height: 65vh;

      object-fit: contain;

      background: #000;

      border-radius: 12px;

      margin-top: 15px;

    }


    #canvas {

      display: none;

    }


    #status {

      margin-top: 15px;

      padding: 12px;

      background: #f2f5f7;

      border-radius: 8px;

      text-align: center;

    }


    #location {

      margin-top: 10px;

      text-align: center;

      font-weight: bold;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    KAMERA TPA WONOKERTO
  </h1>


  <div class="card">


    <label for="cameraSelect">
      Pilih Kamera
    </label>


    <select id="cameraSelect">

      <option value="">
        Memuat kamera...
      </option>

    </select>


    <button id="openCamera">
      BUKA KAMERA
    </button>


    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>


    <canvas id="canvas"></canvas>


    <button
      id="capture"
      disabled>

      AMBIL FOTO

    </button>


    <div id="location">
      📍 -7.641230, 112.764780
    </div>


    <div id="status">
      Memuat kamera...
    </div>


  </div>


</div>


<script>


/* =====================================================
   KONFIGURASI
===================================================== */


/*
 * URL Web App Apps Script
 * yang digunakan sebagai relay LIVE.
 */

const RELAY_URL =
  "https://script.google.com/macros/s/AKfycbxmJWj16HE3QXTm1mG31wMh6PbfEqgs8Sr6iGmNwOn-Bq_1r1SHQItwB_rS5z-DO2DyQw/exec";


/*
 * Koordinat tetap TPA Wonokerto.
 */

const latitude =
  -7.641230;

const longitude =
  112.764780;


/*
 * LIVE dibuat kecil agar ringan.
 */

const LIVE_WIDTH =
  360;

const LIVE_QUALITY =
  0.40;


/*
 * Kirim sekitar 2 frame/detik.
 */

const LIVE_INTERVAL =
  500;


/* =====================================================
   ELEMENT
===================================================== */

let stream = null;

let liveTimer = null;

let liveSending = false;


const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );


const openCamera =
  document.getElementById(
    "openCamera"
  );


const capture =
  document.getElementById(
    "capture"
  );


const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const status =
  document.getElementById(
    "status"
  );


const locationText =
  document.getElementById(
    "location"
  );


/* =====================================================
   LOKASI
===================================================== */

function tampilkanLokasi() {

  locationText.innerText =
    "📍 " +
    latitude +
    ", " +
    longitude;

}


/* =====================================================
   DAFTAR KAMERA
===================================================== */

async function daftarKamera() {

  try {

    /*
     * Minta izin kamera terlebih dahulu.
     * Ini diperlukan agar browser memberikan
     * label kamera secara lengkap.
     */

    const temporaryStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: true,

          audio: false

        });


    temporaryStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    const devices =
      await navigator.mediaDevices
        .enumerateDevices();


    cameraSelect.innerHTML =
      "";


    const cameras =
      devices.filter(
        function(device) {

          return (
            device.kind ===
            "videoinput"
          );

        }
      );


    if (!cameras.length) {

      cameraSelect.innerHTML =
        "<option value=''>" +
        "Kamera tidak ditemukan" +
        "</option>";

      status.innerText =
        "❌ Kamera tidak ditemukan.";

      return;

    }


    let nomor = 1;


    cameras.forEach(
      function(device) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          device.deviceId;


        option.textContent =
          device.label ||
          "Kamera " +
          nomor;


        cameraSelect.appendChild(
          option
        );


        nomor++;

      }
    );


    /*
     * Coba pilih kamera belakang
     * jika label mengandung kata tersebut.
     */

    const kameraBelakang =
      cameras.find(
        function(device) {

          const label =
            (
              device.label ||
              ""
            ).toLowerCase();

          return (
            label.includes(
              "back"
            ) ||
            label.includes(
              "rear"
            ) ||
            label.includes(
              "environment"
            )

          );

        }
      );


    if (kameraBelakang) {

      cameraSelect.value =
        kameraBelakang.deviceId;

    }


    status.innerText =
      "Silakan pilih kamera.";

  }


  catch(error) {

    status.innerText =
      "❌ Kamera tidak dapat diakses: " +
      error.message;

  }

}


/* =====================================================
   BUKA KAMERA
===================================================== */

openCamera.onclick =
  async function() {

    const deviceId =
      cameraSelect.value;


    try {

      /*
       * Matikan kamera lama.
       */

      if (stream) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

      }


      /*
       * Hentikan LIVE lama.
       */

      hentikanLive();


      let constraints;


      if (deviceId) {

        constraints = {

          video: {

            deviceId: {

              exact:
                deviceId

            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        };

      }

      else {

        constraints = {

          video: {

            facingMode:
              "environment",

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        };

      }


      status.innerText =
        "Membuka kamera...";


      stream =
        await navigator.mediaDevices
          .getUserMedia(
            constraints
          );


      video.srcObject =
        stream;


      /*
       * Tunggu video siap.
       */

      await video.play();


      capture.disabled =
        false;


      status.innerText =
        "✅ Kamera aktif. LIVE relay aktif.";


      tampilkanLokasi();


      /*
       * Mulai kirim LIVE ke Apps Script.
       */

      mulaiLive();

    }


    catch(error) {

      console.error(
        error
      );


      status.innerText =
        "❌ Kamera gagal dibuka: " +
        error.message;

    }

  };


/* =====================================================
   LIVE RELAY
===================================================== */

function mulaiLive() {

  hentikanLive();


  liveTimer =
    setInterval(
      kirimLiveFrame,
      LIVE_INTERVAL
    );


  /*
   * Kirim satu frame pertama
   * segera setelah LIVE dimulai.
   */

  kirimLiveFrame();

}


/* =====================================================
   HENTIKAN LIVE
===================================================== */

function hentikanLive() {

  if (liveTimer) {

    clearInterval(
      liveTimer
    );

    liveTimer = null;

  }

}


/* =====================================================
   KIRIM FRAME LIVE
===================================================== */

async function kirimLiveFrame() {

  /*
   * Jangan mengirim frame baru
   * kalau frame sebelumnya belum selesai.
   */

  if (liveSending) {
    return;
  }


  if (!stream) {
    return;
  }


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return;

  }


  liveSending = true;


  try {

    /*
     * Pertahankan rasio kamera.
     */

    const width =
      LIVE_WIDTH;


    const height =
      Math.round(

        video.videoHeight *
        width /
        video.videoWidth

      );


    canvas.width =
      width;


    canvas.height =
      height;


    const context =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );


    context.drawImage(

      video,

      0,
      0,

      width,
      height

    );


    /*
     * JPEG kecil.
     */

    const frame =
      canvas.toDataURL(

        "image/jpeg",

        LIVE_QUALITY

      );


    /*
     * Kirim ke Apps Script.
     */

    const response =
      await fetch(

        RELAY_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              frame:
                frame,

              latitude:
                latitude,

              longitude:
                longitude

            })

        }

      );


    /*
     * Tidak perlu menampilkan
     * response ke pengguna.
     */

    if (!response.ok) {

      console.log(
        "Relay LIVE HTTP:",
        response.status
      );

    }

  }


  catch(error) {

    console.log(
      "LIVE relay:",
      error.message
    );

  }


  finally {

    liveSending =
      false;

  }

}


/* =====================================================
   AMBIL FOTO
===================================================== */

capture.onclick =
  function() {

    if (!stream) {

      alert(
        "Kamera belum dibuka."
      );

      return;

    }


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if (
      !width ||
      !height
    ) {

      alert(
        "Kamera belum siap."
      );

      return;

    }


    /*
     * FOTO DOKUMENTASI
     * tetap menggunakan resolusi
     * kamera asli.
     */

    canvas.width =
      width;


    canvas.height =
      height;


    const context =
      canvas.getContext(
        "2d"
      );


    context.drawImage(

      video,

      0,
      0,

      width,
      height

    );


    /*
     * Kualitas foto dokumentasi
     * tetap tinggi.
     */

    const foto =
      canvas.toDataURL(

        "image/jpeg",

        0.82

      );


    /*
     * Kirim foto ke halaman
     * pemanggil jika memang ada.
     */

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(

        {

          type:
            "KAMERA_TPA_RESULT",

          foto: {

            data:
              foto,

            type:
              "image/jpeg",

            nama:
              "FOTO-" +
              Date.now() +
              ".jpg"

          },

          koordinat: {

            latitude:
              latitude,

            longitude:
              longitude

          }

        },

        "*"

      );


      status.innerText =
        "✅ Foto berhasil dikirim.";

    }

    else {

      /*
       * Jika halaman kamera
       * dibuka langsung,
       * foto tetap dibuat.
       */

      status.innerText =
        "✅ Foto berhasil diambil.";

    }

  };


/* =====================================================
   SAAT HALAMAN DITUTUP
===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    hentikanLive();


    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }

  }
);


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  function() {

    tampilkanLokasi();

    daftarKamera();

  }
);

</script>


</body>

</html>
