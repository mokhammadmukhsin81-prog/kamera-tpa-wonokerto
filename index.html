<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Kamera TPA Wonokerto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #091f30;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      padding: 15px;
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 25px;
    }

    video {
      width: 100%;
      max-height: 600px;
      background: black;
      border-radius: 12px;
      object-fit: cover;
    }

    canvas {
      display: none;
    }

    .buttons {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #buka {
      background: #198754;
      color: white;
    }

    #ambil {
      background: #e83e6f;
      color: white;
    }

    #ulang {
      background: #f0ad00;
      color: white;
    }

    #status {
      margin-top: 15px;
      background: #eaf4fc;
      color: #123b60;
      padding: 15px;
      border-radius: 10px;
      line-height: 1.6;
    }

    #preview {
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
      display: none;
    }

    .coord {
      margin-top: 15px;
      background: #edf9ed;
      color: #175b25;
      padding: 15px;
      border-radius: 10px;
      line-height: 1.7;
    }

    select {
      width: 100%;
      height: 48px;
      border-radius: 8px;
      margin: 10px 0;
      padding: 5px 10px;
      font-size: 16px;
    }

    @media(max-width:600px) {

      .buttons {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

<div class="container">

  <h1>
    📷 KAMERA BUKTI PENDUKUNG
  </h1>


  <select id="kamera">

    <option value="">
      Pilih kamera
    </option>

  </select>


  <video
    id="video"
    autoplay
    playsinline>
  </video>


  <canvas
    id="canvas">
  </canvas>


  <img
    id="preview"
    alt="Foto hasil pengambilan"
  >


  <div class="buttons">

    <button
      id="buka"
      onclick="bukaKamera()">

      BUKA KAMERA

    </button>


    <button
      id="ambil"
      onclick="ambilFoto()">

      AMBIL FOTO

    </button>


    <button
      id="ulang"
      onclick="ambilUlang()">

      AMBIL ULANG

    </button>

  </div>


  <div id="status">

    Kamera belum dibuka.

  </div>


  <div class="coord">

    <strong>
      📍 KOORDINAT
    </strong>

    <div id="koordinat">

      Menunggu lokasi...

    </div>

  </div>

</div>


<script>

  let stream = null;

  let foto = null;

  let lokasi = null;


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  const preview =
    document.getElementById(
      "preview"
    );


  const status =
    document.getElementById(
      "status"
    );


  /* =====================================================
     DAFTAR KAMERA
     ===================================================== */

  async function daftarKamera() {

    try {

      const devices =
        await navigator
          .mediaDevices
          .enumerateDevices();


      const select =
        document.getElementById(
          "kamera"
        );


      select.innerHTML =
        '<option value="">Pilih kamera</option>';


      devices

        .filter(
          function(device) {

            return (
              device.kind ===
              "videoinput"
            );

          }
        )

        .forEach(
          function(device, index) {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              device.deviceId;


            option.textContent =
              device.label ||
              (
                "Kamera " +
                (index + 1)
              );


            select.appendChild(
              option
            );

          }
        );

    } catch (error) {

      console.error(error);

    }

  }


  /* =====================================================
     BUKA KAMERA
     ===================================================== */

  async function bukaKamera() {

    try {

      if (stream) {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      }


      const deviceId =
        document.getElementById(
          "kamera"
        ).value;


      const constraints = {

        video:
          deviceId

            ? {
                deviceId: {
                  exact: deviceId
                }
              }

            : {
                facingMode:
                  "environment"
              },

        audio: false

      };


      stream =
        await navigator
          .mediaDevices
          .getUserMedia(
            constraints
          );


      video.srcObject =
        stream;


      status.innerText =
        "✅ Kamera aktif.";


      await daftarKamera();


      ambilLokasi();

    } catch (error) {

      console.error(error);


      status.innerText =
        "❌ Kamera tidak dapat dibuka: " +
        error.name +
        " - " +
        error.message;

    }

  }


  /* =====================================================
     LOKASI
     ===================================================== */

  function ambilLokasi() {

    if (
      !navigator.geolocation
    ) {

      document.getElementById(
        "koordinat"
      ).innerText =
        "Geolocation tidak tersedia.";

      return;
    }


    navigator.geolocation.getCurrentPosition(

      function(position) {

        lokasi = {

          latitude:
            position.coords.latitude,

          longitude:
            position.coords.longitude,

          accuracy:
            position.coords.accuracy

        };


        tampilkanLokasi();

      },

      function(error) {

        document.getElementById(
          "koordinat"
        ).innerText =
          "Lokasi tidak dapat diperoleh: " +
          error.message;

      },

      {

        enableHighAccuracy: true,

        timeout: 15000,

        maximumAge: 0

      }

    );

  }


  function tampilkanLokasi() {

    if (!lokasi) {
      return;
    }


    document.getElementById(
      "koordinat"
    ).innerHTML =

      "Latitude: " +
      lokasi.latitude +
      "<br>" +

      "Longitude: " +
      lokasi.longitude +
      "<br>" +

      "Akurasi: ±" +
      lokasi.accuracy +
      " meter";

  }


  /* =====================================================
     AMBIL FOTO
     ===================================================== */

  function ambilFoto() {

    if (!stream) {

      alert(
        "Buka kamera terlebih dahulu."
      );

      return;
    }


    if (!lokasi) {

      alert(
        "Koordinat belum tersedia. Tunggu sebentar."
      );

      ambilLokasi();

      return;
    }


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    const maxWidth = 1280;


    let targetWidth =
      width;


    let targetHeight =
      height;


    if (
      width > maxWidth
    ) {

      targetWidth =
        maxWidth;


      targetHeight =
        Math.round(
          height *
          maxWidth /
          width
        );

    }


    canvas.width =
      targetWidth;


    canvas.height =
      targetHeight;


    const context =
      canvas.getContext(
        "2d"
      );


    context.drawImage(

      video,

      0,

      0,

      targetWidth,

      targetHeight

    );


    const dataUrl =
      canvas.toDataURL(
        "image/jpeg",
        0.82
      );


    foto = {

      data:
        dataUrl,

      type:
        "image/jpeg",

      nama:
        "bukti-tpa.jpg"

    };


    preview.src =
      dataUrl;


    preview.style.display =
      "block";


    status.innerHTML =
      "✅ Foto berhasil diambil.<br>" +
      "Foto belum disimpan ke Drive sampai tombol SIMPAN DATA + FOTO ditekan.";


    kirimKeParent();

  }


  /* =====================================================
     AMBIL ULANG
     ===================================================== */

  function ambilUlang() {

    foto = null;


    preview.style.display =
      "none";


    status.innerText =
      "Siap mengambil foto ulang.";


    ambilFoto();

  }


  /* =====================================================
     KIRIM KE INPUTV2
     ===================================================== */

  function kirimKeParent() {

    if (!foto || !lokasi) {
      return;
    }


    const message = {

      type:
        "TPA_CAMERA_CAPTURE",

      foto:
        foto,

      latitude:
        lokasi.latitude,

      longitude:
        lokasi.longitude,

      accuracy:
        lokasi.accuracy

    };


    if (
      window.parent &&
      window.parent !== window
    ) {

      window.parent.postMessage(
        message,
        "*"
      );

    }


    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(
        message,
        "*"
      );

    }

  }


  /* =====================================================
     INIT
     ===================================================== */

  window.addEventListener(
    "load",
    function() {

      daftarKamera();

    }
  );


  document
    .getElementById("kamera")
    .addEventListener(
      "change",
      function() {

        if (stream) {

          bukaKamera();

        }

      }
    );

</script>

</body>

</html>
