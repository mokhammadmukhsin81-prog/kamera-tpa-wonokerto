<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Kamera TPA Wonokerto</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 25px;

  font-family:
    Arial,
    sans-serif;

  background:
    #06283d;

  color: white;

}

.container {

  max-width: 700px;

  margin: auto;

}

h1 {

  text-align: center;

  font-size: 24px;

  margin-bottom: 20px;

}

select {

  width: 100%;

  height: 48px;

  border-radius: 8px;

  border: none;

  padding: 10px;

  font-size: 16px;

  margin-bottom: 10px;

}

video,
canvas {

  width: 100%;

  border-radius: 10px;

  background: black;

}

canvas {

  display: none;

}

.buttons {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 8px;

  margin-top: 10px;

}

button {

  border: none;

  border-radius: 8px;

  padding: 15px;

  font-size: 16px;

  font-weight: bold;

  color: white;

  cursor: pointer;

}

.open {

  background:
    #198754;

}

.take {

  background:
    #e83e8c;

}

.retry {

  background:
    #f0ad00;

}

.status {

  margin-top: 12px;

  padding: 15px;

  background:
    #eef5ff;

  color:
    #064579;

  border-radius: 8px;

}

.location {

  margin-top: 12px;

  padding: 15px;

  background:
    #effbea;

  color:
    #146c2e;

  border-radius: 8px;

}

</style>

</head>


<body>

<div class="container">

<h1>
📷 KAMERA BUKTI PENDUKUNG
</h1>


<select id="cameraSelect">

<option value="">
Pilih kamera
</option>

</select>


<video
  id="video"
  autoplay
  playsinline
></video>


<canvas id="canvas"></canvas>


<div class="buttons">

<button
  class="open"
  onclick="bukaKamera()"
>
BUKA KAMERA
</button>


<button
  class="take"
  onclick="ambilFoto()"
>
AMBIL FOTO
</button>


<button
  class="retry"
  onclick="ambilUlang()"
>
AMBIL ULANG
</button>

</div>


<div
  id="status"
  class="status"
>
Kamera belum dibuka.
</div>


<div
  id="location"
  class="location"
>
📍 <b>KOORDINAT</b>
<br>
Menunggu koordinat...
</div>

</div>


<script>

let stream =
  null;


let fotoTerakhir =
  null;


// =======================================================
// ELEMENT
// =======================================================

const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );


const status =
  document.getElementById(
    "status"
  );


const locationBox =
  document.getElementById(
    "location"
  );


// =======================================================
// STATUS
// =======================================================

function setStatus(
  text
) {

  status.innerText =
    text;

}


// =======================================================
// DAFTAR KAMERA
// =======================================================

async function daftarKamera() {

  try {

    const devices =
      await navigator
        .mediaDevices
        .enumerateDevices();


    cameraSelect.innerHTML =
      "";


    const cameras =
      devices.filter(
        device =>
          device.kind ===
          "videoinput"
      );


    cameras.forEach(
      function(
        camera,
        index
      ) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          camera.deviceId;


        option.textContent =
          camera.label ||
          (
            "Kamera " +
            (index + 1)
          );


        cameraSelect.appendChild(
          option
        );

      }
    );


    if (
      cameras.length > 0
    ) {

      setStatus(
        "Kamera tersedia. Klik BUKA KAMERA."
      );

    }

  } catch (error) {

    setStatus(
      "Gagal membaca kamera: " +
      error.message
    );

  }

}


// =======================================================
// BUKA KAMERA
// =======================================================

async function bukaKamera() {

  try {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    const cameraId =
      cameraSelect.value;


    const constraints = {

      video:
        cameraId
          ? {
              deviceId: {
                exact:
                  cameraId
              }
            }
          : {
              facingMode:
                "environment"
            }

    };


    stream =
      await navigator
        .mediaDevices
        .getUserMedia(
          constraints
        );


    video.srcObject =
      stream;


    await video.play();


    // setelah izin kamera,
    // label kamera biasanya tersedia

    await daftarKamera();


    setStatus(
      "✅ Kamera aktif."
    );


    ambilLokasi();

  } catch (error) {

    setStatus(
      "❌ Kamera tidak dapat dibuka: " +
      error.name +
      " - " +
      error.message
    );

  }

}


// =======================================================
// AMBIL FOTO
// =======================================================

function ambilFoto() {

  if (
    !stream
  ) {

    setStatus(
      "Buka kamera terlebih dahulu."
    );

    return;

  }


  if (
    video.readyState <
    2
  ) {

    setStatus(
      "Kamera belum siap."
    );

    return;

  }


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  if (
    !width ||
    !height
  ) {

    setStatus(
      "Ukuran kamera belum tersedia."
    );

    return;

  }


  canvas.width =
    width;


  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  const dataUrl =
    canvas.toDataURL(
      "image/jpeg",
      0.85
    );


  fotoTerakhir =
    dataUrl;


  // =====================================================
  // KIRIM FOTO KE APPS SCRIPT
  // =====================================================

  if (
    window.opener
  ) {

    window.opener.postMessage(

      {

        type:
          "TPA_WONOKERTO_FOTO",

        data:
          dataUrl,

        mimeType:
          "image/jpeg",

        fileName:
          "foto-tpa-wonokerto.jpg"

      },

      "https://script.google.com"

    );


    // kirim koordinat juga

    kirimKoordinat();


    setStatus(
      "✅ Foto berhasil dikirim ke form. Anda boleh kembali ke halaman input."
    );

  } else {

    setStatus(
      "Foto berhasil diambil, tetapi halaman input tidak ditemukan."
    );

  }

}


// =======================================================
// AMBIL ULANG
// =======================================================

function ambilUlang() {

  fotoTerakhir =
    null;


  bukaKamera();

}


// =======================================================
// GEOLOCATION
// =======================================================

function ambilLokasi() {

  if (
    !navigator.geolocation
  ) {

    locationBox.innerText =
      "Geolocation tidak tersedia.";

    return;

  }


  navigator
    .geolocation
    .getCurrentPosition(

      function(position) {

        tampilkanLokasi(
          position
        );

      },

      function(error) {

        locationBox.innerText =
          "Lokasi tidak dapat diperoleh: " +
          error.message;

      },

      {

        enableHighAccuracy:
          true,

        timeout:
          15000,

        maximumAge:
          0

      }

    );

}


// =======================================================
// TAMPILKAN LOKASI
// =======================================================

function tampilkanLokasi(
  position
) {

  const lat =
    position.coords.latitude;


  const lng =
    position.coords.longitude;


  const acc =
    position.coords.accuracy;


  locationBox.innerHTML =

    "📍 <b>KOORDINAT</b>" +

    "<br>Latitude: " +
    lat +

    "<br>Longitude: " +
    lng +

    "<br>Akurasi: ±" +
    Math.round(acc) +
    " meter";

}


// =======================================================
// KIRIM KOORDINAT
// =======================================================

function kirimKoordinat() {

  if (
    !navigator.geolocation
  ) {

    return;

  }


  navigator
    .geolocation
    .getCurrentPosition(

      function(position) {

        if (
          !window.opener
        ) {

          return;

        }


        window.opener.postMessage(

          {

            type:
              "TPA_WONOKERTO_LOKASI",

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude,

            accuracy:
              position.coords.accuracy

          },

          "https://script.google.com"

        );

      },

      function() {},

      {

        enableHighAccuracy:
          true,

        timeout:
          15000,

        maximumAge:
          0

      }

    );

}


// =======================================================
// START
// =======================================================

daftarKamera();

ambilLokasi();


// =======================================================
// STOP KAMERA SAAT HALAMAN DITUTUP
// =======================================================

window.addEventListener(
  "beforeunload",
  function() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

  }
);

</script>

</body>

</html>
