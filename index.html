<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Kamera TPA Wonokerto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      padding: 20px;

      background: #08263a;

      color: white;

      font-family: Arial, sans-serif;

    }


    .container {

      max-width: 700px;

      margin: auto;

    }


    h1 {

      text-align: center;

      font-size: 26px;

    }


    select,
    button {

      width: 100%;

      padding: 15px;

      margin-top: 12px;

      border-radius: 8px;

      border: 0;

      font-size: 17px;

    }


    select {

      background: white;

      color: #111;

    }


    button {

      background: #198754;

      color: white;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      background: #555;

    }


    #capture {

      background: #e83e8c;

    }


    #retake {

      background: #f0ad00;

    }


    video {

      display: block;

      width: 100%;

      height: 470px;

      object-fit: contain;

      background: black;

      border-radius: 10px;

      margin-top: 15px;

    }


    canvas {

      display: none;

    }


    #status {

      margin-top: 15px;

      padding: 15px;

      background: #e9f2fa;

      color: #123;

      border-radius: 8px;

      text-align: center;

    }


    #location {

      margin-top: 10px;

      padding: 15px;

      background: #e9f8e7;

      color: #146b2e;

      border-radius: 8px;

      line-height: 1.6;

    }


    #photoPreview {

      width: 100%;

      max-height: 470px;

      object-fit: contain;

      background: black;

      border-radius: 10px;

      margin-top: 15px;

      display: none;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📷 KAMERA BUKTI PENDUKUNG
  </h1>


  <select id="cameraSelect">

    <option value="">
      Memilih kamera...
    </option>

  </select>


  <button
    id="openCamera"
  >
    🎥 BUKA KAMERA
  </button>


  <video
    id="video"
    autoplay
    playsinline>
  </video>


  <button
    id="capture"
    disabled
  >
    📷 AMBIL FOTO
  </button>


  <button
    id="retake"
    disabled
  >
    🔄 AMBIL ULANG
  </button>


  <canvas id="canvas"></canvas>


  <img
    id="photoPreview"
    alt="Foto hasil"
  >


  <div id="status">
    Kamera belum dibuka.
  </div>


  <div id="location">
    📍 Koordinat belum tersedia
  </div>


</div>


<script>

  let stream = null;

  let latitude = "";

  let longitude = "";

  let accuracy = "";


  const cameraSelect =
    document.getElementById(
      "cameraSelect"
    );


  const openCamera =
    document.getElementById(
      "openCamera"
    );


  const capture =
    document.getElementById(
      "capture"
    );


  const retake =
    document.getElementById(
      "retake"
    );


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  const photoPreview =
    document.getElementById(
      "photoPreview"
    );


  const status =
    document.getElementById(
      "status"
    );


  const locationBox =
    document.getElementById(
      "location"
    );


  /* =====================================================
     DAFTAR KAMERA
     ===================================================== */

  async function daftarKamera() {

    try {

      /*
       * Jangan langsung meminta kamera
       * ketika halaman dibuka.
       *
       * Kamera baru diminta ketika
       * user klik BUKA KAMERA.
       */

      const devices =
        await navigator.mediaDevices
          .enumerateDevices();


      cameraSelect.innerHTML =
        '<option value="">Pilih kamera</option>';


      let nomor = 1;


      devices.forEach(
        function(device) {

          if (
            device.kind !==
            "videoinput"
          ) {

            return;

          }


          const option =
            document.createElement(
              "option"
            );


          option.value =
            device.deviceId;


          option.textContent =
            device.label ||
            "Kamera " +
            nomor;


          cameraSelect.appendChild(
            option
          );


          nomor++;

        }
      );


      status.innerText =
        "Silakan klik BUKA KAMERA.";

    }

    catch(error) {

      status.innerText =
        "❌ Gagal membaca kamera: " +
        error.message;

    }

  }


  /* =====================================================
     BUKA KAMERA
     ===================================================== */

  openCamera.onclick =
    async function() {

      try {

        /*
         * Hentikan stream lama
         */

        if (stream) {

          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );

        }


        const deviceId =
          cameraSelect.value;


        let constraints;


        if (deviceId) {

          constraints = {

            video: {

              deviceId: {
                exact:
                  deviceId
              }

            },

            audio: false

          };

        }

        else {

          /*
           * Utamakan kamera belakang
           * untuk HP.
           */

          constraints = {

            video: {

              facingMode: {
                ideal:
                  "environment"
              },

              width: {
                ideal: 1920
              },

              height: {
                ideal: 1080
              }

            },

            audio: false

          };

        }


        status.innerText =
          "⏳ Meminta izin kamera...";


        stream =
          await navigator
            .mediaDevices
            .getUserMedia(
              constraints
            );


        video.srcObject =
          stream;


        await video.play();


        capture.disabled =
          false;


        retake.disabled =
          true;


        status.innerText =
          "✅ Kamera aktif. Silakan AMBIL FOTO.";


        /*
         * Setelah izin berhasil,
         * sekarang label kamera
         * bisa diperoleh.
         */

        const devices =
          await navigator.mediaDevices
            .enumerateDevices();


        cameraSelect.innerHTML =
          '<option value="">Pilih kamera</option>';


        let nomor = 1;


        devices.forEach(
          function(device) {

            if (
              device.kind !==
              "videoinput"
            ) {

              return;

            }


            const option =
              document.createElement(
                "option"
              );


            option.value =
              device.deviceId;


            option.textContent =
              device.label ||
              "Kamera " +
              nomor;


            if (
              device.deviceId ===
              deviceId
            ) {

              option.selected =
                true;

            }


            cameraSelect.appendChild(
              option
            );


            nomor++;

          }
        );


        ambilLokasi();

      }

      catch(error) {

        console.error(error);


        status.innerText =
          "❌ Kamera gagal dibuka: " +
          error.name +
          " - " +
          error.message;

      }

    };


  /* =====================================================
     LOKASI
     ===================================================== */

  function ambilLokasi() {

    if (
      !navigator.geolocation
    ) {

      locationBox.innerText =
        "📍 GPS tidak tersedia.";

      return;

    }


    locationBox.innerText =
      "📍 Mengambil koordinat...";


    navigator.geolocation
      .getCurrentPosition(

        function(position) {

          latitude =
            position.coords.latitude;

          longitude =
            position.coords.longitude;

          accuracy =
            position.coords.accuracy;


          locationBox.innerHTML =

            "📍 <b>KOORDINAT</b><br>" +

            "Latitude: " +
            latitude +
            "<br>" +

            "Longitude: " +
            longitude +
            "<br>" +

            "Akurasi: ±" +
            accuracy +
            " meter";

        },

        function(error) {

          console.error(error);


          locationBox.innerText =
            "📍 Lokasi tidak dapat diperoleh: " +
            error.message;

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            0

        }

      );

  }


  /* =====================================================
     AMBIL FOTO
     ===================================================== */

  capture.onclick =
    function() {

      if (!stream) {

        alert(
          "Kamera belum dibuka."
        );

        return;

      }


      const width =
        video.videoWidth;


      const height =
        video.videoHeight;


      if (
        !width ||
        !height
      ) {

        alert(
          "Kamera belum siap. Tunggu beberapa detik."
        );

        return;

      }


      canvas.width =
        width;


      canvas.height =
        height;


      const context =
        canvas.getContext(
          "2d"
        );


      context.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      /*
       * JPEG dikompres agar
       * tidak terlalu besar
       */

      const foto =
        canvas.toDataURL(
          "image/jpeg",
          0.82
        );


      /*
       * Tampilkan hasil foto
       */

      photoPreview.src =
        foto;


      photoPreview.style.display =
        "block";


      /*
       * Kirim ke InputV2
       */

      const message = {

        type:
          "KAMERA_TPA_RESULT",

        foto: {

          data:
            foto,

          type:
            "image/jpeg",

          nama:
            "BUKTI-" +
            Date.now() +
            ".jpg"

        },

        koordinat: {

          latitude:
            latitude,

          longitude:
            longitude,

          accuracy:
            accuracy

        }

      };


      /*
       * CEK OPENER
       */

      if (
        !window.opener ||
        window.opener.closed
      ) {

        status.innerText =
          "❌ InputV2 tidak ditemukan. Pastikan kamera dibuka dari tombol BUKA KAMERA di InputV2.";

        return;

      }


      /*
       * KIRIM FOTO
       */

      try {

        window.opener.postMessage(
          message,
          "*"
        );


        /*
         * Kirim ulang beberapa kali
         * supaya lebih tahan terhadap
         * timing popup.
         */

        setTimeout(
          function() {

            try {

              window.opener.postMessage(
                message,
                "*"
              );

            }
            catch(e) {}

          },
          300
        );


        setTimeout(
          function() {

            try {

              window.opener.postMessage(
                message,
                "*"
              );

            }
            catch(e) {}

          },
          800
        );


        status.innerText =
          "✅ FOTO BERHASIL DIKIRIM KE INPUT V2.";


        retake.disabled =
          false;


        /*
         * Matikan kamera
         */

        if (stream) {

          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );

        }


        capture.disabled =
          true;


        /*
         * Jangan langsung window.close().
         *
         * Biarkan popup tetap terbuka
         * agar user bisa melihat bahwa
         * foto sudah terkirim.
         */

      }

      catch(error) {

        console.error(error);

        status.innerText =
          "❌ Gagal mengirim foto: " +
          error.message;

      }

    };


  /* =====================================================
     AMBIL ULANG
     ===================================================== */

  retake.onclick =
    function() {

      photoPreview.style.display =
        "none";

      capture.disabled =
        true;

      retake.disabled =
        true;


      openCamera.click();

    };


  /* =====================================================
     MULAI
     ===================================================== */

  window.addEventListener(
    "load",
    daftarKamera
  );

</script>

</body>

</html>
