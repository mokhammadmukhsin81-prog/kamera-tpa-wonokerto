<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Kamera TPA Wonokerto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      border: 0;
      font-size: 16px;
    }

    select {
      background: white;
      color: #111;
    }

    button {
      background: #1976d2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #capture {
      background: #2e7d32;
    }

    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background: black;
      border-radius: 10px;
      margin-top: 15px;
    }

    canvas {
      display: none;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      background: #222;
      border-radius: 8px;
      text-align: center;
    }

    #location {
      margin-top: 10px;
      padding: 10px;
      text-align: center;
      color: #ccc;
      font-size: 14px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📷 KAMERA TPA WONOKERTO</h1>

  <select id="cameraSelect">

    <option value="">
      Memilih kamera...
    </option>

  </select>


  <button id="openCamera">
    🎥 BUKA KAMERA
  </button>


  <video
    id="video"
    autoplay
    playsinline>
  </video>


  <button
    id="capture"
    disabled>
    📷 AMBIL FOTO
  </button>


  <canvas id="canvas"></canvas>


  <div id="status">
    Kamera belum dibuka.
  </div>


  <div id="location">
    📍 Koordinat tetap:
    -7.641230, 112.764780
  </div>

</div>


<script>

  /* =====================================================
     KONFIGURASI
     ===================================================== */

  const LATITUDE =
    -7.641230;

  const LONGITUDE =
    112.764780;


  /* =====================================================
     VARIABEL
     ===================================================== */

  let stream = null;


  /* =====================================================
     ELEMENT
     ===================================================== */

  const cameraSelect =
    document.getElementById(
      "cameraSelect"
    );

  const openCamera =
    document.getElementById(
      "openCamera"
    );

  const capture =
    document.getElementById(
      "capture"
    );

  const video =
    document.getElementById(
      "video"
    );

  const canvas =
    document.getElementById(
      "canvas"
    );

  const status =
    document.getElementById(
      "status"
    );


  /* =====================================================
     DAFTAR KAMERA
     ===================================================== */

  async function daftarKamera() {

    try {

      status.innerText =
        "⏳ Meminta izin kamera...";


      const temporaryStream =
        await navigator
          .mediaDevices
          .getUserMedia({
            video: true,
            audio: false
          });


      temporaryStream
        .getTracks()
        .forEach(
          function(track) {
            track.stop();
          }
        );


      const devices =
        await navigator
          .mediaDevices
          .enumerateDevices();


      cameraSelect.innerHTML =
        '<option value="">Memilih kamera...</option>';


      let nomor = 1;


      devices.forEach(
        function(device) {

          if (
            device.kind !==
            "videoinput"
          ) {
            return;
          }


          const option =
            document.createElement(
              "option"
            );


          option.value =
            device.deviceId;


          option.textContent =
            device.label ||
            "Kamera " + nomor;


          cameraSelect.appendChild(
            option
          );


          nomor++;

        }
      );


      status.innerText =
        "✅ Silakan pilih kamera.";


    }
    catch(error) {

      status.innerText =
        "❌ Kamera ditolak: " +
        error.message;

    }

  }


  /* =====================================================
     BUKA KAMERA
     ===================================================== */

  openCamera.onclick =
    async function() {

      const deviceId =
        cameraSelect.value;


      try {

        if (stream) {

          stream
            .getTracks()
            .forEach(
              function(track) {
                track.stop();
              }
            );

        }


        let constraints;


        if (deviceId) {

          constraints = {

            video: {

              deviceId: {
                exact: deviceId
              }

            },

            audio: false

          };

        }
        else {

          constraints = {

            video: {
              facingMode:
                "environment"
            },

            audio: false

          };

        }


        stream =
          await navigator
            .mediaDevices
            .getUserMedia(
              constraints
            );


        video.srcObject =
          stream;


        capture.disabled =
          false;


        status.innerText =
          "✅ Kamera aktif. Silakan AMBIL FOTO.";


      }
      catch(error) {

        status.innerText =
          "❌ Kamera gagal dibuka: " +
          error.message;

      }

    };


  /* =====================================================
     STAMP FOTO
     ===================================================== */

  function buatFotoDenganStamp() {

    const width =
      video.videoWidth;

    const height =
      video.videoHeight;


    if (
      !width ||
      !height
    ) {

      throw new Error(
        "Kamera belum siap."
      );

    }


    canvas.width =
      width;

    canvas.height =
      height;


    const ctx =
      canvas.getContext("2d");


    /* FOTO ASLI */

    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    /* =================================================
       STAMP
       ================================================= */

    const sekarang =
      new Date();


    const tanggal =
      sekarang.toLocaleDateString(
        "id-ID",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );


    const jam =
      sekarang.toLocaleTimeString(
        "id-ID",
        {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }
      );


    /*
     * Ukuran stamp menyesuaikan
     * resolusi kamera.
     */

    const ukuranFont =
      Math.max(
        18,
        Math.round(
          width / 45
        )
      );


    const padding =
      Math.round(
        ukuranFont * 0.7
      );


    const lineHeight =
      Math.round(
        ukuranFont * 1.45
      );


    const stampHeight =
      padding * 2 +
      lineHeight * 4;


    const stampY =
      height -
      stampHeight;


    /*
     * Background hitam transparan
     */

    ctx.fillStyle =
      "rgba(0,0,0,0.72)";


    ctx.fillRect(
      0,
      stampY,
      width,
      stampHeight
    );


    /*
     * Tulisan
     */

    ctx.fillStyle =
      "#ffffff";


    ctx.font =
      "bold " +
      ukuranFont +
      "px Arial";


    ctx.textBaseline =
      "top";


    const x =
      padding;


    let y =
      stampY +
      padding;


    ctx.fillText(
      "TPA WONOKERTO",
      x,
      y
    );


    y += lineHeight;


    ctx.font =
      ukuranFont +
      "px Arial";


    ctx.fillText(
      "Koordinat: " +
      LATITUDE.toFixed(6) +
      ", " +
      LONGITUDE.toFixed(6),
      x,
      y
    );


    y += lineHeight;


    ctx.fillText(
      "Tanggal: " +
      tanggal,
      x,
      y
    );


    y += lineHeight;


    ctx.fillText(
      "Jam: " +
      jam,
      x,
      y
    );


    /*
     * Tambahkan garis kecil
     * sebagai pembatas.
     */

    ctx.strokeStyle =
      "rgba(255,255,255,0.7)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
      x,
      stampY + padding - 5
    );

    ctx.lineTo(
      width - padding,
      stampY + padding - 5
    );

    ctx.stroke();


    /*
     * Kompres JPEG
     */

    return canvas.toDataURL(
      "image/jpeg",
      0.85
    );

  }


  /* =====================================================
     AMBIL FOTO
     ===================================================== */

  capture.onclick =
    function() {

      try {

        if (!stream) {

          alert(
            "Kamera belum dibuka."
          );

          return;

        }


        status.innerText =
          "⏳ Membuat foto + stamp...";


        /*
         * FOTO SUDAH DITAMP + DIUBAH
         * MENJADI BASE64.
         */

        const foto =
          buatFotoDenganStamp();


        /*
         * Pastikan hasil benar-benar
         * berupa gambar.
         */

        if (
          !foto ||
          !foto.startsWith(
            "data:image/jpeg"
          )
        ) {

          throw new Error(
            "Foto gagal dibuat."
          );

        }


        status.innerText =
          "⏳ Mengirim foto ke Input V2...";


        /*
         * InputV2 dibuka dari
         * window.open().
         */

        const target =
          window.opener;


        if (
          !target ||
          target.closed
        ) {

          throw new Error(
            "Halaman Input V2 tidak ditemukan. Tutup kamera ini lalu buka kamera dari Input V2."
          );

        }


        /*
         * KIRIM FOTO KE INPUT V2
         */

        target.postMessage(

          {

            type:
              "KAMERA_TPA_RESULT",


            foto: {

              data:
                foto,

              type:
                "image/jpeg",

              nama:
                "BUKTI-TPA-" +
                Date.now() +
                ".jpg"

            },


            koordinat: {

              latitude:
                LATITUDE,

              longitude:
                LONGITUDE,

              accuracy:
                0

            }

          },

          "*"

        );


        /*
         * Tutup kamera.
         */

        if (stream) {

          stream
            .getTracks()
            .forEach(
              function(track) {
                track.stop();
              }
            );

        }


        status.innerText =
          "✅ FOTO SUDAH DISTAMP DAN DIKIRIM KE INPUT V2.";


        /*
         * Jangan langsung tutup.
         * Beri waktu postMessage.
         */

        setTimeout(
          function() {

            window.close();

          },
          1000
        );


      }
      catch(error) {

        console.error(error);


        status.innerText =
          "❌ Gagal mengambil/mengirim foto: " +
          error.message;

      }

    };


  /* =====================================================
     START
     ===================================================== */

  window.addEventListener(
    "load",
    daftarKamera
  );

</script>

</body>

</html>
