<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>
    Kamera TPA Wonokerto
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #062b40;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(900px, 96%);
      margin: 0 auto;
      padding: 20px 0 30px;
    }

    h1 {
      text-align: center;
      margin: 5px 0 20px;
      font-size: 32px;
    }

    .status {
      background: #e9f4fa;
      color: #17374d;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      font-size: 16px;
    }

    select,
    button {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 9px;
      margin-bottom: 12px;
      font-size: 16px;
    }

    select {
      padding: 10px;
      background: white;
      color: #222;
    }

    button {
      background: #159957;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #18aa62;
    }

    button:disabled {
      background: #777;
      cursor: not-allowed;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .location {
      margin-top: 12px;
      background: #edf9e8;
      color: #236b39;
      padding: 13px;
      border-radius: 9px;
      font-weight: bold;
    }

    #canvas {
      display: none;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>
    📹 KAMERA TPA WONOKERTO
  </h1>


  <div
    id="status"
    class="status">

    🟡 Menyiapkan kamera...

  </div>


  <select id="cameraSelect">

    <option value="">
      Memilih kamera...
    </option>

  </select>


  <button
    id="openCamera">

    📹 BUKA KAMERA

  </button>


  <div class="video-box">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>

  </div>


  <div
    id="location"
    class="location">

    📍 Koordinat TPA:
    -7.641230, 112.764780

  </div>


  <button
    id="capture">

    📸 AMBIL FOTO

  </button>


  <canvas id="canvas"></canvas>

</div>


<script>

/* =====================================================
   KONFIGURASI
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const isLiveMode =
  params.get("mode") === "live";


const LIVE_TARGET =
  window.opener;


/* =====================================================
   ELEMENT
===================================================== */

const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );

const openCamera =
  document.getElementById(
    "openCamera"
  );

const capture =
  document.getElementById(
    "capture"
  );

const video =
  document.getElementById(
    "video"
  );

const canvas =
  document.getElementById(
    "canvas"
  );

const status =
  document.getElementById(
    "status"
  );

const locationText =
  document.getElementById(
    "location"
  );


/* =====================================================
   VARIABLE
===================================================== */

let stream = null;

let liveTimer = null;

let latitude =
  -7.641230;

let longitude =
  112.764780;


/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

  status.innerText =
    text;

}


/* =====================================================
   KIRIM PESAN KE DASHBOARD
===================================================== */

function kirimKeDashboard(data) {

  try {

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(
        data,
        "*"
      );

      return true;

    }

  }

  catch(error) {

    console.error(
      error
    );

  }

  return false;

}


/* =====================================================
   DAFTAR KAMERA
===================================================== */

async function daftarKamera() {

  try {

    /*
     * Minta izin terlebih dahulu.
     * Ini juga membuat label kamera
     * dapat terbaca oleh browser.
     */

    const temporaryStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: true,
          audio: false

        });


    temporaryStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    const devices =
      await navigator
        .mediaDevices
        .enumerateDevices();


    cameraSelect.innerHTML =
      "";


    const cameras =
      devices.filter(
        function(device) {

          return device.kind ===
            "videoinput";

        }
      );


    if (!cameras.length) {

      cameraSelect.innerHTML =
        "<option value=''>" +
        "Kamera tidak ditemukan" +
        "</option>";

      setStatus(
        "❌ Kamera tidak ditemukan."
      );

      return false;

    }


    let nomor = 1;


    cameras.forEach(
      function(device) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          device.deviceId;


        option.textContent =
          device.label ||
          "Kamera " + nomor;


        cameraSelect.appendChild(
          option
        );


        nomor++;

      }
    );


    /*
     * Pilih kamera pertama
     * secara otomatis.
     */

    if (
      !cameraSelect.value &&
      cameras.length
    ) {

      cameraSelect.value =
        cameras[0].deviceId;

    }


    setStatus(
      "🟢 Kamera siap."
    );


    return true;

  }

  catch(error) {

    console.error(
      error
    );


    setStatus(
      "❌ Izin kamera gagal: " +
      error.message
    );


    return false;

  }

}


/* =====================================================
   BUKA KAMERA
===================================================== */

async function bukaKamera() {

  try {

    /*
     * Matikan stream lama.
     */

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }


    const deviceId =
      cameraSelect.value;


    let constraints;


    if (deviceId) {

      constraints = {

        video: {

          deviceId: {
            exact: deviceId
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      };

    }

    else {

      constraints = {

        video: {

          facingMode:
            "environment",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      };

    }


    setStatus(
      "🟡 Membuka kamera..."
    );


    stream =
      await navigator
        .mediaDevices
        .getUserMedia(
          constraints
        );


    video.srcObject =
      stream;


    await video.play();


    capture.disabled =
      false;


    setStatus(
      "🟢 KAMERA AKTIF — LIVE"
    );


    mulaiLive();


    /*
     * Beri tahu dashboard
     * bahwa kamera sudah hidup.
     */

    kirimKeDashboard({

      type:
        "KAMERA_LIVE_READY",

      latitude:
        latitude,

      longitude:
        longitude

    });

  }

  catch(error) {

    console.error(
      error
    );


    setStatus(
      "❌ Kamera gagal dibuka: " +
      error.message
    );


    kirimKeDashboard({

      type:
        "KAMERA_LIVE_ERROR",

      message:
        error.message

    });

  }

}


/* =====================================================
   LIVE FRAME
===================================================== */

function mulaiLive() {

  if (liveTimer) {
    clearInterval(liveTimer);
  }

  liveTimer = setInterval(function() {

    if (!stream) {
      return;
    }

    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {
      return;
    }

    // ================================
    // LIVE RINGAN
    // ================================

    const width = 360;

    const height =
      Math.round(
        video.videoHeight *
        width /
        video.videoWidth
      );

    canvas.width = width;
    canvas.height = height;

    const context =
      canvas.getContext("2d", {
        alpha: false
      });

    context.drawImage(
      video,
      0,
      0,
      width,
      height
    );

    // JPEG kecil untuk LIVE
    const frame =
      canvas.toDataURL(
        "image/jpeg",
        0.40
      );

    try {

      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.opener.postMessage(

          {
            type: "KAMERA_LIVE_FRAME",

            frame: frame,

            latitude: latitude,

            longitude: longitude,

            waktu: Date.now()

          },

          "*"

        );

      }

    }

    catch(error) {

      console.log(
        "Gagal mengirim frame:",
        error
      );

    }

  }, 120);

}

        kirimKeDashboard({

          type:
            "KAMERA_LIVE_FRAME",

          frame:
            frame,

          latitude:
            latitude,

          longitude:
            longitude

        });

      },
      300
    );

}


/* =====================================================
   AMBIL FOTO
===================================================== */

capture.onclick =
  function() {

    if (!stream) {

      alert(
        "Kamera belum aktif."
      );

      return;

    }


    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      alert(
        "Kamera belum siap."
      );

      return;

    }


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const context =
      canvas.getContext(
        "2d"
      );


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const foto =
      canvas.toDataURL(
        "image/jpeg",
        0.82
      );


    kirimKeDashboard({

      type:
        "KAMERA_TPA_RESULT",

      foto: {

        data:
          foto,

        type:
          "image/jpeg",

        nama:
          "FOTO-" +
          Date.now() +
          ".jpg"

      },

      koordinat: {

        latitude:
          latitude,

        longitude:
          longitude

      }

    });


    setStatus(
      "✅ Foto dikirim."
    );

  };


/* =====================================================
   TOMBOL MANUAL
===================================================== */

openCamera.onclick =
  async function() {

    await bukaKamera();

  };


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  async function() {

    locationText.innerText =
      "📍 Koordinat TPA: " +
      latitude +
      ", " +
      longitude;


    const berhasil =
      await daftarKamera();


    /*
     * MODE LIVE:
     *
     * Dashboard membuka
     * index.html?mode=live.
     *
     * Langsung aktifkan kamera.
     */

    if (
      berhasil &&
      isLiveMode
    ) {

      await bukaKamera();

    }

  }
);


/* =====================================================
   JIKA DASHBOARD DITUTUP
===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    if (liveTimer) {

      clearInterval(
        liveTimer
      );

    }


    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }

  }
);

</script>

</body>
</html>
