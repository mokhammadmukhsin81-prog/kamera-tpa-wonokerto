<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>
    Kamera Bukti Pendukung - TPA Wonokerto
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #061f31;

      color: white;

    }


    .container {

      width: 100%;

      max-width: 900px;

      margin: auto;

    }


    h1 {

      text-align: center;

      font-size: 25px;

      margin: 5px 0 20px;

    }


    select {

      width: 100%;

      padding: 13px;

      border-radius: 8px;

      border: 0;

      font-size: 16px;

      margin-bottom: 10px;

    }


    video {

      display: block;

      width: 100%;

      height: auto;

      min-height: 300px;

      max-height: 650px;

      object-fit: cover;

      background: black;

      border-radius: 10px;

    }


    canvas {

      display: none;

    }


    .buttons {

      display: grid;

      grid-template-columns:
        1fr 1fr 1fr;

      gap: 8px;

      margin-top: 10px;

    }


    button {

      border: 0;

      border-radius: 8px;

      padding: 15px 8px;

      font-weight: bold;

      font-size: 15px;

      color: white;

      cursor: pointer;

    }


    #btnBuka {

      background: #168b58;

    }


    #btnAmbil {

      background: #e83267;

    }


    #btnUlang {

      background: #f0ad00;

    }


    #btnTutup {

      background: #777;

    }


    button:disabled {

      opacity: .5;

      cursor: not-allowed;

    }


    .status {

      margin-top: 12px;

      padding: 14px;

      background: #edf5fc;

      color: #17415e;

      border-radius: 8px;

    }


    .koordinat {

      margin-top: 12px;

      padding: 15px;

      background: #edf9ed;

      color: #165d2a;

      border-radius: 8px;

    }


    .hasil {

      margin-top: 12px;

      padding: 15px;

      background: #fff6d9;

      color: #5f4a00;

      border-radius: 8px;

    }


    .hasil img {

      width: 100%;

      max-height: 400px;

      object-fit: contain;

      background: #111;

      border-radius: 8px;

      margin-top: 10px;

    }


    @media(max-width:600px) {

      body {
        padding: 10px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📷 KAMERA BUKTI PENDUKUNG
  </h1>


  <select
    id="kamera">

    <option value="">
      Pilih kamera
    </option>

  </select>


  <video
    id="video"
    autoplay
    playsinline>
  </video>


  <canvas
    id="canvas">
  </canvas>


  <div class="buttons">

    <button
      id="btnBuka"
      onclick="bukaKamera()">

      BUKA KAMERA

    </button>


    <button
      id="btnAmbil"
      onclick="ambilFoto()"
      disabled>

      AMBIL FOTO

    </button>


    <button
      id="btnUlang"
      onclick="ambilUlang()"
      disabled>

      AMBIL ULANG

    </button>

  </div>


  <div class="status"
       id="status">

    Kamera belum aktif.

  </div>


  <div class="koordinat">

    <strong>
      📍 KOORDINAT
    </strong>

    <div id="koordinat"
         style="margin-top:8px;">

      Mencari lokasi...

    </div>

  </div>


  <div
    class="hasil"
    id="hasil"
    style="display:none;">

    <strong>
      ✅ FOTO SIAP DISIMPAN
    </strong>

    <div>
      Foto akan disimpan ketika
      <b>SIMPAN DATA + FOTO</b>
      ditekan pada form V2.
    </div>

    <img
      id="preview"
      alt="Foto bukti">

  </div>


</div>


<script>


/* ========================================================
   VARIABEL
   ======================================================== */

let stream =
  null;


let capturedBlob =
  null;


let latitude =
  "";


let longitude =
  "";


let accuracy =
  "";


/* ========================================================
   ELEMEN
   ======================================================== */

const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const kamera =
  document.getElementById(
    "kamera"
  );


const statusEl =
  document.getElementById(
    "status"
  );


const koordinatEl =
  document.getElementById(
    "koordinat"
  );


const preview =
  document.getElementById(
    "preview"
  );


const hasil =
  document.getElementById(
    "hasil"
  );


const btnAmbil =
  document.getElementById(
    "btnAmbil"
  );


const btnUlang =
  document.getElementById(
    "btnUlang"
  );


/* ========================================================
   DAFTAR KAMERA
   ======================================================== */

async function daftarKamera() {

  try {

    const devices =
      await navigator.mediaDevices
        .enumerateDevices();


    kamera.innerHTML =
      "";


    const daftar =
      devices.filter(
        function(device) {

          return (
            device.kind ===
            "videoinput"
          );

        }
      );


    if (!daftar.length) {

      kamera.innerHTML =
        "<option>" +
        "Kamera tidak ditemukan" +
        "</option>";

      return;

    }


    daftar.forEach(
      function(device, index) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          device.deviceId;


        option.textContent =
          device.label ||
          (
            "Kamera " +
            (index + 1)
          );


        kamera.appendChild(
          option
        );

      }
    );


  } catch (error) {

    statusEl.innerHTML =
      "❌ Gagal membaca kamera: " +
      error.message;

  }

}


/* ========================================================
   BUKA KAMERA
   ======================================================== */

async function bukaKamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung kamera."
      );

    }


    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    const deviceId =
      kamera.value;


    const constraints = {

      video:
        deviceId
          ? {
              deviceId: {
                exact:
                  deviceId
              }
            }
          : {
              facingMode:
                "environment"
            },

      audio: false

    };


    stream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    video.srcObject =
      stream;


    await video.play();


    btnAmbil.disabled =
      false;


    statusEl.innerHTML =
      "✅ Kamera aktif.";


    await daftarKamera();


    ambilLokasi();


  } catch (error) {

    console.error(error);


    statusEl.innerHTML =
      "❌ Kamera tidak dapat dibuka: " +
      error.message;

  }

}


/* ========================================================
   AMBIL FOTO
   ======================================================== */

function ambilFoto() {

  if (!stream) {

    alert(
      "Buka kamera terlebih dahulu."
    );

    return;

  }


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    alert(
      "Kamera belum siap."
    );

    return;

  }


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  const context =
    canvas.getContext(
      "2d"
    );


  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  canvas.toBlob(
    function(blob) {

      if (!blob) {

        alert(
          "Foto gagal dibuat."
        );

        return;

      }


      capturedBlob =
        blob;


      const objectUrl =
        URL.createObjectURL(
          blob
        );


      preview.src =
        objectUrl;


      hasil.style.display =
        "block";


      btnUlang.disabled =
        false;


      statusEl.innerHTML =
        "✅ Foto berhasil diambil.";


      /*
       * LANGSUNG KIRIM KE INPUT V2
       * TIDAK ADA DOWNLOAD
       */

      kirimFotoKeParent();

    },
    "image/jpeg",
    0.88
  );

}


/* ========================================================
   AMBIL ULANG
   ======================================================== */

function ambilUlang() {

  capturedBlob =
    null;


  hasil.style.display =
    "none";


  preview.src =
    "";


  statusEl.innerHTML =
    "Silakan ambil foto ulang.";


  ambilFoto();

}


/* ========================================================
   KIRIM FOTO KE INPUT V2
   ======================================================== */

function kirimFotoKeParent() {

  if (!capturedBlob) {

    return;

  }


  const reader =
    new FileReader();


  reader.onloadend =
    function() {

      const hasilFoto = {

        data:
          reader.result,

        type:
          capturedBlob.type ||
          "image/jpeg",

        nama:
          "BUKTI-" +
          Date.now() +
          ".jpg",

        latitude:
          latitude,

        longitude:
          longitude,

        accuracy:
          accuracy

      };


      window.parent.postMessage(

        {

          tipe:
            "HASIL_KAMERA_TPA",

          data:
            hasilFoto

        },

        "*"

      );

    };


  reader.readAsDataURL(
    capturedBlob
  );

}


/* ========================================================
   LOKASI
   ======================================================== */

function ambilLokasi() {

  if (
    !navigator.geolocation
  ) {

    koordinatEl.innerHTML =
      "❌ Geolocation tidak didukung browser.";

    return;

  }


  koordinatEl.innerHTML =
    "Mencari lokasi...";


  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude =
        position.coords.latitude;


      longitude =
        position.coords.longitude;


      accuracy =
        Math.round(
          position.coords.accuracy
        );


      tampilkanLokasi();


    },


    function(error) {

      koordinatEl.innerHTML =
        "⚠️ Lokasi belum tersedia: " +
        error.message;

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

}


/* ========================================================
   TAMPILKAN LOKASI
   ======================================================== */

function tampilkanLokasi() {

  koordinatEl.innerHTML =

    "Latitude: " +
    latitude +
    "<br>" +

    "Longitude: " +
    longitude +
    "<br>" +

    "Akurasi: ±" +
    accuracy +
    " meter";

}


/* ========================================================
   TUTUP KAMERA SAAT HALAMAN DITINGGALKAN
   ======================================================== */

function tutupKamera() {

  if (!stream) {
    return;
  }


  stream
    .getTracks()
    .forEach(
      function(track) {

        track.stop();

      }
    );


  stream =
    null;


  video.srcObject =
    null;


  btnAmbil.disabled =
    true;


  statusEl.innerHTML =
    "Kamera ditutup.";

}


/* ========================================================
   EVENT PILIH KAMERA
   ======================================================== */

kamera.addEventListener(
  "change",
  function() {

    if (stream) {

      bukaKamera();

    }

  }
);


/* ========================================================
   INIT
   ======================================================== */

window.addEventListener(
  "load",
  function() {

    daftarKamera();

    ambilLokasi();

  }
);


window.addEventListener(
  "beforeunload",
  function() {

    tutupKamera();

  }
);


</script>


</body>
</html>
